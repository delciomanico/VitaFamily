# nginx do frontend: SPA (todas as rotas → index.html) e cache adequada a uma PWA.
# Atrás do Traefik do Dokploy (ADR-014), que termina o TLS de vitafamily.cassfrei.com e liga à porta 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # 127.0.0.11 é o DNS embutido do Docker (dokploy-network). Resolver "api" numa variável, não
    # direto no proxy_pass, para a resolução acontecer por pedido, não ao carregar a configuração
    # — caso contrário o nginx recusa-se a arrancar se o contentor "api" ainda não existir
    # (ordem de arranque entre os dois ficheiros Compose/apps do Dokploy não é garantida).
    resolver 127.0.0.11 valid=30s;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # A API corre no contentor "api" (deploy/docker-compose.api.prod.yml), só na rede interna
    # do Dokploy (dokploy-network); não tem domínio próprio no Traefik. Este nginx é o único
    # ponto exposto à internet e reencaminha /api/ para lá — mesma origem para o browser,
    # sem expor o backend diretamente.
    location /api/ {
        # Com proxy_pass por variável, o nginx não normaliza/substitui o prefixo da location —
        # anexa o URI completo recebido ($request_uri, já com "/api/...") ao valor da variável.
        # Por isso o valor NÃO repete "/api/" (seria "/api//api/v1/...", 404 confirmado em teste).
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11m;
        proxy_read_timeout 30s;
    }

    # Ficheiros com hash no nome: imutáveis.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Service worker, manifesto e index.html nunca em cache, para as atualizações chegarem.
    location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
