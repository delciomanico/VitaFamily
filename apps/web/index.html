  <body>
    <div id="root">
      <!-- Carregamento da marca enquanto o JavaScript chega; a app substitui isto ao arrancar. -->
      <style>
        .boot{display:flex;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:#fff;font-family:Inter,system-ui,sans-serif}
        .boot svg{width:7rem;height:7rem;animation:bootbeat 1.8s ease-in-out infinite}
        .boot b{font-size:1.875rem;letter-spacing:-.02em;color:#17242c}
        @keyframes bootbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.09)}28%{transform:scale(.98)}42%{transform:scale(1.05)}60%{transform:scale(1)}}
        @media (prefers-reduced-motion:reduce){.boot svg{animation:none}}
      </style>
      <div class="boot" role="status">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M246 432C150 384 90 304 100 228C108 160 160 112 214 80C252 150 274 222 268 292C264 350 256 396 246 432Z" fill="#4aafd0"/>
          <path d="M268 430C280 384 286 334 286 290C288 236 284 198 276 170C304 140 346 126 382 134C430 146 448 196 438 246C424 318 354 382 268 430Z" fill="#167698"/>
          <path d="M60 290H452" stroke="#2a9cc0" stroke-width="22" stroke-linecap="round" fill="none"/>
          <path d="M124 290H178L208 234L242 350L282 202L316 290H424" fill="none" stroke="#fff" stroke-width="22" stroke-linejoin="round"/>
        </svg>
        <b>Vita Family</b>
      </div>
    </div>
    <noscript>O Vita Family precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
