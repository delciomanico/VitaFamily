# Serviços de desenvolvimento (só dados sintéticos). Portas ligadas a 127.0.0.1.
# Uso: cp .env.example .env (preencher) && make up
name: vitafamily

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vita} -d $${POSTGRES_DB:-vita}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Nem minio/minio (Docker Hub) nem quay.io/minio/minio continuam puxáveis sem login (a MinIO
    # passou ambos a exigir autenticação). bitnamilegacy/minio é o fork gratuito da Bitnami, sem
    # essa exigência; entrypoint próprio já arranca o servidor (sem `command:`), dados em
    # /bitnami/minio/data (não /data).
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    env_file: .env
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/bitnami/minio/data]

  clamav:
    image: clamav/clamav:stable
    ports: ["127.0.0.1:3310:3310"]
    volumes: [clamdata:/var/lib/clamav]

  mailhog:
    image: mailhog/mailhog:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  api:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: api
    command: ["sh", "-c", "node apps/api/dist/src/main/migrate.js && node apps/api/dist/src/main/api.js"]
    env_file: .env
    expose: ["8080"]
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  web:
    profiles: ["apps"]
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports: ["127.0.0.1:${WEB_PORT:-8088}:8080"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  clamdata:
