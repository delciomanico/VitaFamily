# Serviços de desenvolvimento (só dados sintéticos). Portas ligadas a 127.0.0.1.
# Uso: cp .env.example .env (preencher) && make up
name: vitafamily

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vita}
      POSTGRES_DB: ${POSTGRES_DB:-vita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Nem minio/minio (Docker Hub) nem quay.io/minio/minio continuam puxáveis sem login (a MinIO
    # passou ambos a exigir autenticação). bitnamilegacy/minio é o fork gratuito da Bitnami, sem
    # essa exigência; entrypoint próprio já arranca o servidor (sem `command:`), dados em
    # /bitnami/minio/data (não /data).
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER em .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD em .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/bitnami/minio/data]

  clamav:
    image: clamav/clamav:stable
    ports: ["127.0.0.1:3310:3310"]
    volumes: [clamdata:/var/lib/clamav]

  mailhog:
    image: mailhog/mailhog:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
  miniodata:
  clamdata:
