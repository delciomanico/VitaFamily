# Frontend em produção no Dokploy (ADR-014/ADR-019): https://vitafamily.cassfrei.com
# Sem portas publicadas: no Dokploy, configurar o domínio vitafamily.cassfrei.com, serviço web, caminho /,
# porta do contentor 8080 (não 80) e HTTPS (Let's Encrypt). O Traefik do Dokploy termina o TLS e encaminha
# para o nginx do contentor — o único serviço com domínio no Dokploy. O nginx serve a PWA e reencaminha
# /api/ internamente para o contentor "api" (ADR-019); o backend nunca fica exposto diretamente.
name: vitafamily-web

services:
  web:
    build:
      context: ../apps/web
    expose: ["8080"]
    # O Traefik do Dokploy só alcança contentores nesta rede; sem ela, o domínio dá 502 Bad Gateway.
    # É também por aqui (dokploy-network) que este contentor alcança "api" para o proxy de /api/.
    networks: [dokploy-network]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
