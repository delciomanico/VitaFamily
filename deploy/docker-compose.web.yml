# Só o frontend (PWA com dados mock); não precisa dos serviços do backend nem de .env.
# Uso: make web-up  →  http://localhost:8088
name: vitafamily-web

services:
  web:
    build: ../apps/web
    image: vitafamily/web:dev
    ports: ["127.0.0.1:${WEB_PORT:-8088}:8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
