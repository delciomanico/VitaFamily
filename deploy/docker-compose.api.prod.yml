# Backend em produção no Dokploy (ADR-014/ADR-017/ADR-019): sem domínio nem porta pública.
# Não configurar nenhuma app/domínio para este serviço no Dokploy — só é alcançado dentro da
# dokploy-network, pelo contentor "web" (deploy/docker-compose.web.prod.yml), que reencaminha
# /api/ do seu nginx para http://api:8080/api/ (ADR-019). Postgres/Redis/MinIO/ClamAV continuam só na
# rede interna, alcançáveis pelo nome do serviço.
# Variáveis de ambiente: copiar deploy/.env.example para deploy/.env e preencher com segredos de
# produção (nunca os de dev) — nunca commitar deploy/.env.
name: vitafamily-api

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # Aplica as migrações pendentes antes de arrancar a API (runner próprio, idempotente —
    # db/migrate-runner.ts — não reaplica o que já está em schema_migrations). Sem isto, um
    # deploy cuja imagem trouxe migrações novas arranca contra tabelas em falta (ex.: "relation
    # users does not exist"), porque nada corria `migrate` automaticamente antes do `api.js`.
    command: ["sh", "-c", "node apps/api/dist/src/main/migrate.js && node apps/api/dist/src/main/api.js"]
    container_name: api # nome estável na dokploy-network: é assim que o nginx do "web" o encontra.
    env_file: .env
    expose: ["8080"]
    networks: [dokploy-network]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/src/main/worker.js"]
    env_file: .env
    networks: [dokploy-network]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # O runner de migrações não usa lock consultivo (db/migrate-runner.ts): se o worker
      # arrancasse em paralelo com o "api", os dois tentariam aplicar a mesma migração ao mesmo
      # tempo. Esperar pelo healthcheck do "api" (só fica healthy depois de `migrate` + `api.js`
      # arrancarem, ver apps/api/Dockerfile) garante que o schema já está atualizado.
      api:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER em .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB em .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em .env}
    networks: [dokploy-network]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    # ADR-038: só contadores dos limitadores de taxa. Rede interna, SEM porta publicada nem
    # domínio; efémero (sem volume, sem backup; reiniciar zera os contadores). noeviction é
    # deliberado: sem memória o limitador falha fechado em vez de despejar contadores.
    # CONFIG/FLUSHALL/FLUSHDB/KEYS/DEBUG desativados (ADR-038 §11).
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD em .env}
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
        --maxmemory 64mb --maxmemory-policy noeviction --protected-mode yes
        --rename-command CONFIG "" --rename-command FLUSHALL "" --rename-command FLUSHDB ""
        --rename-command KEYS "" --rename-command DEBUG ""
    networks: [dokploy-network]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  minio:
    # Nem minio/minio (Docker Hub) nem quay.io/minio/minio continuam puxáveis sem login (a MinIO
    # passou ambos a exigir autenticação). bitnamilegacy/minio é o fork gratuito da Bitnami, sem
    # essa exigência; entrypoint próprio já arranca o servidor (sem `command:`), dados em
    # /bitnami/minio/data (não /data).
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER em .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD em .env}
    networks: [dokploy-network]
    volumes: [miniodata:/bitnami/minio/data]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    networks: [dokploy-network]
    volumes: [clamdata:/var/lib/clamav]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  clamdata:

networks:
  dokploy-network:
    external: true
