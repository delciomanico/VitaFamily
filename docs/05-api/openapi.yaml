          description: "A família nunca define REQUESTED, nem confirma REQUESTED -> SCHEDULED (exclusivo do portal da clínica, PUT /clinic-portal/requests/{appointmentId}, D17)."
    AvailableSlot:
      type: object
      required: [id, clinicId, clinicName, kind, specialty, startsAt, durationMinutes, capacity, remaining]
      properties:
        id:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        clinicName:
          type: string
        kind:
          type: string
          enum: [APPOINTMENT, EXAM]
        specialty:
          type: string
          description: "Em kind=EXAM é o tipo de exame."
        professionalName:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        capacity:
          type: integer
          minimum: 1
          maximum: 50
          description: "Vagas totais do horário (BR-APT-11). Sempre 1 em APPOINTMENT."
        remaining:
          type: integer
          minimum: 1
          description: "Vagas livres agora (capacity - marcações ativas); a listagem só devolve horários com remaining >= 1."
    Clinic:
      type: object
      required: [id, name, type, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        type:
          type: string
          enum: [PARTNER, PRIVATE]
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        displayName:
          type: string
          nullable: true
          description: "M14 R (BR-CLN-38). Nome de apresentação da clínica parceira; a app mostra displayName ?? name. Nulo em clínicas privadas."
        description:
          type: string
          nullable: true
          description: "M14 R. Descrição curta (≤500) da clínica parceira."
        openingHours:
          type: string
          nullable: true
          description: "M14 R. Horário de funcionamento em texto livre (≤500)."
    ClinicInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    ClinicPatch:
      type: object
      properties:
        name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    ClinicStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
    ClinicRootAccountRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: "D18. A palavra-passe inicial/reposta é enviada por e-mail, fora do corpo da resposta."
    ClinicLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ClinicTokenResponse:
      type: object
      required: [accessToken, expiresIn, clinicId, role]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
        clinicId:
          type: string
          format: uuid
        role:
          type: string
          enum: [CLINIC_ADMIN, CLINIC_MANAGER, CLINIC_DOCTOR]
        professionalId:
          type: string
          format: uuid
          nullable: true
          description: "M14 R (BR-CLN-39). Só em CLINIC_DOCTOR: o profissional cuja agenda e pacientes a conta vê; também vai nos claims do token."
    ClinicAccount:
      type: object
      required: [id, clinicId, email, role, status]
      properties:
        id:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [CLINIC_ADMIN, CLINIC_MANAGER, CLINIC_DOCTOR]
          description: "CLINIC_DOCTOR desde M14 R (BR-CLN-39)."
        professionalId:
          type: string
          format: uuid
          nullable: true
          description: "M14 R. Só em CLINIC_DOCTOR."
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
    ClinicStaffInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: "Palavra-passe inicial enviada por e-mail (BR-CLN-05)."
        role:
          type: string
          enum: [CLINIC_MANAGER, CLINIC_DOCTOR]
          default: CLINIC_MANAGER
          description: "M14 R (BR-CLN-39). Nunca CLINIC_ADMIN (só o Platform Admin cria a conta raiz)."
        professionalId:
          type: string
          format: uuid
          description: "Obrigatório em CLINIC_DOCTOR (profissional ativo da própria clínica, ainda sem conta Médico); proibido em CLINIC_MANAGER (VALIDATION_ERROR)."
    ClinicSlot:
      type: object
      required: [id, clinicId, kind, specialty, startsAt, durationMinutes, capacity]
      properties:
        id:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [APPOINTMENT, EXAM]
          description: "D19/BR-APT-10. Uma consulta só se marca em APPOINTMENT, um exame só em EXAM."
        specialty:
          type: string
          description: "Em kind=EXAM é o tipo de exame."
        professionalName:
          type: string
          nullable: true
        professionalId:
          type: string
          format: uuid
          nullable: true
          description: "M14 (a1). Profissional do catálogo (BR-CLN-11); nulo nos horários manuais antigos. Com valor aplica-se a deteção de sobreposição (BR-CLN-13) e os bloqueios (BR-CLN-14)."
        serviceTypeId:
          type: string
          format: uuid
          nullable: true
          description: "M14 (a1). Tipo de serviço do catálogo; nulo nos horários manuais antigos."
        scheduleRuleId:
          type: string
          format: uuid
          nullable: true
          description: "M14 (a2). Preenchido nos horários gerados por uma regra (BR-CLN-12); estes não se removem individualmente (DELETE /clinic-portal/slots/{id} -> CONFLICT): usar bloqueio ou desativar a regra."
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        capacity:
          type: integer
          minimum: 1
          maximum: 50
          description: "BR-APT-11. Sempre 1 em APPOINTMENT."
    ClinicSlotPatch:
      type: object
      required: [capacity]
      properties:
        capacity:
          type: integer
          minimum: 1
          maximum: 50
          description: "Só kind=EXAM; não pode ser inferior às marcações ativas (CONFLICT)."
    ClinicSlotView:
      allOf:
        - $ref: "#/components/schemas/ClinicSlot"
        - type: object
          required: [state, bookedCount, remaining]
          properties:
            state:
              type: string
              enum: [FREE, REQUESTED, SCHEDULED, PARTIAL, FULL]
              description: "kind=APPOINTMENT: FREE|REQUESTED|SCHEDULED. kind=EXAM (BR-APT-11): FREE (bookedCount=0), PARTIAL (0 < bookedCount < capacity), FULL (remaining=0)."
            bookedCount:
              type: integer
              minimum: 0
              description: "Marcações ativas: EXAM = exames SCHEDULED; APPOINTMENT = consulta REQUESTED/SCHEDULED (0 ou 1)."
            remaining:
              type: integer
              minimum: 0
              description: "capacity - bookedCount."
    ClinicSlotBatchInput:
      type: object
      required: [date, times]
      properties:
        kind:
          type: string
          enum: [APPOINTMENT, EXAM]
          description: "D19/BR-APT-10. Omitido = APPOINTMENT sem serviceTypeId; com serviceTypeId vem do serviço (valor diferente -> VALIDATION_ERROR)."
        capacity:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
          description: "BR-APT-11: vagas de cada horário criado. Só kind=EXAM pode ser > 1 (em APPOINTMENT, > 1 -> VALIDATION_ERROR)."
        date:
          type: string
          format: date
          description: "Dia local (UC-CLN-04)."
        times:
          type: array
          items:
            type: string
          description: "Horas locais HH:mm."
        specialty:
          type: string
          description: "Obrigatório sem serviceTypeId (M14 a1: com serviceTypeId é o nome do serviço)."
        professionalName:
          type: string
          nullable: true
          description: "Texto livre (horários manuais antigos). Com professionalId é o nome do profissional (o valor enviado é ignorado)."
        professionalId:
          type: string
          format: uuid
          nullable: true
          description: "M14 (a1, BR-CLN-11/13). Profissional ativo da clínica (NOT_FOUND se de outra clínica); ativa a deteção de sobreposição (CONFLICT) e o conflito com bloqueios (CONFLICT)."
        serviceTypeId:
          type: string
          format: uuid
          nullable: true
          description: "M14 (a1). Serviço ativo da clínica; kind, specialty e durationMinutes vêm dele (valores enviados diferentes -> VALIDATION_ERROR)."
        durationMinutes:
          type: integer
          enum: [15, 20, 30, 45, 60]
          description: "Obrigatório sem serviceTypeId."
    ClinicProfessional:
      type: object
      required: [id, name, specialty, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        specialty: { type: string, maxLength: 80, nullable: true, description: "Informativa (BR-CLN-11)." }
        active: { type: boolean }
    ClinicProfessionalInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        specialty: { type: string, maxLength: 80, nullable: true }
    ClinicProfessionalPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        specialty: { type: string, maxLength: 80, nullable: true }
        active: { type: boolean }
    ClinicServiceType:
      type: object
      required: [id, name, kind, durationMinutes, priceMinor, currency, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        kind:
          type: string
          enum: [APPOINTMENT, EXAM]
          description: "Consulta (APPOINTMENT) ou exame (EXAM); mesmo enum de ClinicSlot.kind. Imutável."
        durationMinutes: { type: integer, enum: [15, 20, 30, 45, 60] }
        priceMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000000
          nullable: true
          description: "Preço em cêntimos (inteiro), opcional, só informativo nesta fase (BR-CLN-12)."
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          readOnly: true
          description: "Moeda da clínica (clinics.currency; AOA por omissão). Só leitura em M14 a1/a2."
        active: { type: boolean }
    ClinicServiceTypeInput:
      type: object
      additionalProperties: false
      required: [name, kind, durationMinutes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [APPOINTMENT, EXAM] }
        durationMinutes: { type: integer, enum: [15, 20, 30, 45, 60] }
        priceMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000, nullable: true }
    ClinicServiceTypePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "kind não é alterável (enviá-lo -> VALIDATION_ERROR)."
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        durationMinutes: { type: integer, enum: [15, 20, 30, 45, 60] }
        priceMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000, nullable: true }
        active: { type: boolean }
    ClinicScheduleRule:
      type: object
      required: [id, professionalId, serviceTypeId, weekdays, startTime, endTime, validFrom, validUntil, capacity, active]
      properties:
        id: { type: string, format: uuid }
        professionalId: { type: string, format: uuid }
        serviceTypeId: { type: string, format: uuid }
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
          description: "ISO: 1 = segunda ... 7 = domingo."
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: "Hora local da clínica (HH:mm)." }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: "Hora local; > startTime; o último horário termina em ou antes de endTime." }
        validFrom: { type: string, format: date, nullable: true, description: "Dia local; nulo = desde já." }
        validUntil: { type: string, format: date, nullable: true, description: "Dia local inclusivo; nulo = sem fim." }
        capacity: { type: integer, minimum: 1, maximum: 50, description: "Vagas por horário gerado; > 1 só se o serviço for EXAM (BR-APT-11)." }
        active: { type: boolean }
    ClinicScheduleRuleInput:
      type: object
      additionalProperties: false
      required: [professionalId, serviceTypeId, weekdays, startTime, endTime]
      properties:
        professionalId: { type: string, format: uuid }
        serviceTypeId: { type: string, format: uuid }
        weekdays: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 1, maximum: 7 } }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        validFrom: { type: string, format: date, nullable: true }
        validUntil: { type: string, format: date, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 50, default: 1 }
    ClinicScheduleRulePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "professionalId e serviceTypeId não são alteráveis."
      properties:
        weekdays: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 1, maximum: 7 } }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        validFrom: { type: string, format: date, nullable: true }
        validUntil: { type: string, format: date, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 50 }
        active: { type: boolean }
    ClinicScheduleGeneration:
      type: object
      required: [created, unchanged, removed, skippedOverlap, skippedTimeOff, keptBooked]
      description: "Resultado de uma geração/reconciliação (BR-CLN-12/15). Só contagens, sem dados pessoais."
      properties:
        created: { type: integer, minimum: 0, description: "ClinicSlot criados." }
        unchanged: { type: integer, minimum: 0, description: "Já existiam (idempotência)." }
        removed: { type: integer, minimum: 0, description: "Livres futuros removidos pela reconciliação." }
        skippedOverlap: { type: integer, minimum: 0, description: "Ignorados por sobreposição com outro horário do profissional (BR-CLN-13)." }
        skippedTimeOff: { type: integer, minimum: 0, description: "Ignorados por bloqueio/férias (BR-CLN-14)." }
        keptBooked: { type: integer, minimum: 0, description: "Horários que já não correspondem à regra mas têm marcações ativas e foram mantidos." }
    ClinicScheduleRuleResult:
      type: object
      required: [rule, generation]
      properties:
        rule: { $ref: "#/components/schemas/ClinicScheduleRule" }
        generation: { $ref: "#/components/schemas/ClinicScheduleGeneration" }
    ClinicTimeOff:
      type: object
      required: [id, professionalId, startsAt, endsAt, reason, bookedSlotCount]
      properties:
        id: { type: string, format: uuid }
        professionalId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: string, maxLength: 200, nullable: true, description: "Nota interna da clínica; nunca em auditoria nem logs." }
        bookedSlotCount: { type: integer, minimum: 0, description: "Horários no intervalo ainda com marcações ativas (calculado)." }
    ClinicTimeOffInput:
      type: object
      additionalProperties: false
      required: [professionalId, startsAt, endsAt]
      properties:
        professionalId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: "> startsAt, no máximo 366 dias depois, e no futuro." }
        reason: { type: string, maxLength: 200, nullable: true }
    ClinicTimeOffBookedSlot:
      type: object
      required: [slotId, kind, startsAt, durationMinutes, bookedCount]
      description: "Horário do bloqueio com marcações ativas, a tratar pela clínica (agenda/exam-agenda). Sem dados do paciente."
      properties:
        slotId: { type: string, format: uuid }
        kind: { type: string, enum: [APPOINTMENT, EXAM] }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        bookedCount: { type: integer, minimum: 1 }
    ClinicTimeOffResult:
      type: object
      required: [timeOff, removedSlots, bookedSlots]
      properties:
        timeOff: { $ref: "#/components/schemas/ClinicTimeOff" }
        removedSlots: { type: integer, minimum: 0, description: "Horários livres removidos." }
        bookedSlots:
          type: array
          items: { $ref: "#/components/schemas/ClinicTimeOffBookedSlot" }
    ClinicBooking:
      type: object
      required: [id, status, scheduledAt, patientName]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [REQUESTED, SCHEDULED, REJECTED, COMPLETED, NO_SHOW, CANCELLED]
        scheduledAt:
          type: string
          format: date-time
        specialty:
          type: string
          nullable: true
        professionalName:
          type: string
          nullable: true
        patientName:
          type: string
          description: "Mínimo necessário (BR-CLN-03); nunca dados de saúde da família. Em visitas manuais é o nome do paciente da clínica."
        notes:
          type: string
          nullable: true
        responseNote:
          type: string
          nullable: true
        source:
          type: string
          enum: [VITA, MANUAL]
          description: "M14 P (BR-CLN-18). VITA = consulta no membro Vita (omissão); MANUAL = visita presencial só da clínica (paciente sem ligação Vita)."
        clinicPatientId:
          type: string
          format: uuid
          nullable: true
          description: "M14 P. Paciente da clínica a que pertence (ligação por membro ou visita manual); nulo se ainda não existir registo da clínica."
        slotId:
          type: string
          format: uuid
          nullable: true
        confirmationStatus:
          $ref: "#/components/schemas/ConfirmationStatus"
        confirmationSource:
          type: string
          enum: [PATIENT, CLINIC]
          nullable: true
          description: "M14 Q (BR-CLN-25/27). PATIENT = 'Vou' na app; CLINIC = 'confirmado por telefone'. Nulo se PENDING ou DECLINED."
        dayState:
          type: string
          enum: [SCHEDULED, ARRIVED, IN_PROGRESS, COMPLETED, NO_SHOW, CANCELLED, REQUESTED, REJECTED]
          description: "M14 Q (BR-CLN-28). Estado do dia, derivado do estado + arrivedAt/startedAt; ARRIVED e IN_PROGRESS não existem como estado Vita (a consulta continua SCHEDULED)."
        arrivedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        waitingMinutes:
          type: integer
          minimum: 0
          nullable: true
          description: "Espera: (startedAt ou agora) - arrivedAt, em minutos inteiros; nulo sem arrivedAt."
        followUpDueOn:
          type: string
          format: date
          nullable: true
          description: "M14 Q (BR-CLN-30). Retorno proposto ainda por tratar."
        receiptId:
          type: string
          format: uuid
          nullable: true
          description: "M14 R (BR-CLN-31). Recibo ISSUED da marcação; nulo se não existe. Nunca devolvido ao CLINIC_DOCTOR (BR-CLN-39)."
        reportStatus:
          type: string
          enum: [DRAFT, FINAL]
          nullable: true
          description: "M15 S (BR-CLN-41). Estado do relatório da consulta; nulo se não existe."
        examOrderCount:
          type: integer
          minimum: 0
          description: "M15 U (BR-CLN-51). Pedidos de exame não cancelados da marcação."
        processId:
          type: string
          format: uuid
          nullable: true
          description: "Marco B fatia 1 (BR-PRC-06). Id do Process da marcação, só para consultas Vita (source=VITA); nulo em visitas manuais (BR-CLN-24) e antes do backfill. Abre GET /clinic-portal/processes/{processId}."
    ClinicPatientLookupRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: "E-mail exato (normalizado no servidor); nunca registado em logs/auditoria."
    ClinicPatientLookupResult:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          description: "Primeiro nome + inicial do último apelido (ex. 'Maria S.'). Nenhum id (BR-CLN-03, BR-CLN-10)."
    ClinicWalkInAppointmentRequest:
      type: object
      additionalProperties: false
      required: [slotId]
      oneOf:
        - required: [patientEmail]
        - required: [clinicPatientId]
      description: "BR-CLN-10/18. Exatamente um de patientEmail (utilizador Vita, ADR-024) e clinicPatientId (paciente da clínica, M14 P)."
      properties:
        patientEmail:
          type: string
          format: email
          maxLength: 254
        clinicPatientId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        notes:
          type: string
          maxLength: 2000
          nullable: true
    ClinicConsent:
      type: object
      required: [clinicId, clinicName, level, validUntil, renewalNeeded, linked]
      description: "BR-CLN-19. O que uma clínica parceira pode ver do membro (quem vê o quê)."
      properties:
        clinicId: { type: string, format: uuid }
        clinicName: { type: string }
        level:
          type: string
          enum: [BOOKINGS, HISTORY]
          description: "Nível efetivo. BOOKINGS = Marcações (omissão); HISTORY = Partilhar histórico (medicação e exames). HISTORY expirado aparece como BOOKINGS."
        validUntil: { type: string, format: date-time, nullable: true, description: "Fim da validade do nível HISTORY (12 meses); nulo em BOOKINGS." }
        renewalNeeded: { type: boolean, description: "true se o HISTORY expirou e pode ser renovado." }
        linked: { type: boolean, description: "true se a clínica já tem um paciente ligado a este membro." }
    ClinicConsentInput:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level: { type: string, enum: [BOOKINGS, HISTORY] }
    ClinicLinkCode:
      type: object
      required: [code, expiresAt]
      description: "BR-CLN-20. Código de uso único, 10 min. Apresentar à clínica em texto ou QR (o QR codifica só o código)."
      properties:
        code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{8}$', description: "8 caracteres sem 0/O/1/I/L; mostrado como XXXX-XXXX (o hífen é ignorado ao consumir)." }
        expiresAt: { type: string, format: date-time }
    ClinicPatientVitaLink:
      type: object
      required: [via, consentLevel, consentValidUntil]
      description: "BR-CLN-17/19. Sem ids Vita: só a forma da ligação e o consentimento efetivo."
      properties:
        via: { type: string, enum: [EMAIL, CODE] }
        consentLevel: { type: string, enum: [BOOKINGS, HISTORY], nullable: true }
        consentValidUntil: { type: string, format: date-time, nullable: true }
    ClinicPatient:
      type: object
      required: [id, name, phone, email, birthDate, notes, origin, vitaLink, createdAt, updatedAt]
      description: "BR-CLN-17. Registo próprio da clínica (a clínica é responsável pelo tratamento, ADR-026). Nunca contém ids Vita."
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, maxLength: 30, nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true, description: "Contacto da clínica; nunca é usado para procurar contas Vita." }
        birthDate: { type: string, format: date, nullable: true }
        notes: { type: string, maxLength: 2000, nullable: true, description: "Notas internas da clínica." }
        origin: { type: string, enum: [MANUAL, VITA] }
        vitaLink:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ClinicPatientVitaLink"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClinicPatientInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, maxLength: 30, pattern: '^[+0-9 ()-]{5,30}$', nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        birthDate: { type: string, format: date, nullable: true, description: "Não pode ser futura." }
        notes: { type: string, maxLength: 2000, nullable: true }
    ClinicPatientPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, maxLength: 30, pattern: '^[+0-9 ()-]{5,30}$', nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        notes: { type: string, maxLength: 2000, nullable: true }
    ProcessFamilyStatus:
      type: string
      enum: [SCHEDULED, IN_PROGRESS, DONE, CANCELLED]
      description: "Estado visível à família (`_arquivo/marco-b/marco-b-construcao.md` §6): Marcado / A tratar / Feito / Cancelado. Derivado, nunca escrito (BR-PRC-02)."
    ProcessKind:
      type: string
      enum: [ROUTINE]
      description: "ROUTINE: episódio de cuidado aberto por um ato (consulta/exame). O valor AUTHORIZED do enum da BD é inerte (arquivo do marco B, ADR-037) e nunca é devolvido. Conjunto aberto: os clientes tratam valores desconhecidos como genéricos."
    ProcessOriginType:
      type: string
      enum: [APPOINTMENT, EXAMINATION]
      description: "Ato que abriu o processo. O valor AUTHORIZATION do enum da BD é inerte (ADR-037) e nunca é devolvido. Conjunto aberto: valores novos em marcos seguintes (ex.: BOOKING no MK3)."
    ProcessNextStepCode:
      type: string
      enum: [AWAIT_CLINIC_RESPONSE, ATTEND, BEING_ATTENDED, RESCHEDULE, NOTHING_PENDING]
      description: "Frase estruturada 'o que falta' (a UI traduz, lib/labels.ts). Conjunto aberto: os clientes tratam códigos desconhecidos como NOTHING_PENDING/genérico."
    ProcessNextStepActor:
      type: string
      enum: [FAMILY, CLINIC, NONE]
      description: "De quem falta. Clientes toleram valores desconhecidos."
    ProcessNextStep:
      type: object
      required: [code, actor]
      properties:
        code: { $ref: "#/components/schemas/ProcessNextStepCode" }
        actor: { $ref: "#/components/schemas/ProcessNextStepActor" }
    ProcessActPhase:
      type: string
      enum: [PENDING, SCHEDULED, IN_PROGRESS, DONE, CANCELLED, NO_SHOW]
      description: "Facto estável publicado pelo módulo dono do ato (BR-PRC-04). Mapeamento em state-machines.md (Process)."
    Process:
      type: object
      required: [id, memberId, kind, familyStatus, nextStep, origin, openedAt]
      properties:
        id: { type: string, format: uuid, description: "= processId (BR-PRC-01)." }
        memberId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProcessKind" }
        familyStatus: { $ref: "#/components/schemas/ProcessFamilyStatus" }
        nextStep: { $ref: "#/components/schemas/ProcessNextStep" }
        origin:
          type: object
          required: [type, id]
          properties:
            type: { $ref: "#/components/schemas/ProcessOriginType" }
            id: { type: string, format: uuid, description: "Id da consulta/exame; abre GET .../appointments/{id} ou .../examinations/{id}." }
        scheduledAt: { type: string, format: date-time, nullable: true, description: "Quando o ato está/esteve marcado (facto do ato); nulo se o ato não tem hora." }
        openedAt: { type: string, format: date-time }
    ProcessPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Process" }
        nextCursor: { type: string, nullable: true }
    ClinicProcess:
      type: object
      required: [id, kind, origin, openedAt, phase]
      description: "BR-PRC-06: mínimo necessário; nunca ids Vita (família/membro), familyStatus nem nextStep."
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProcessKind" }
        origin:
          type: object
          required: [type, id]
          properties:
            type: { $ref: "#/components/schemas/ProcessOriginType" }
            id: { type: string, format: uuid, description: "Id da marcação/exame na agenda da própria clínica." }
        phase: { $ref: "#/components/schemas/ProcessActPhase" }
        openedAt: { type: string, format: date-time }
    ClinicPatientPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ClinicPatient" }
        nextCursor: { type: string, nullable: true }
    ClinicPatientLinkRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 8, maxLength: 9, description: "O código do paciente (com ou sem hífen, sem distinção de maiúsculas). Nunca registado em logs/auditoria." }
        clinicPatientId: { type: string, format: uuid, description: "Opcional: liga este paciente da clínica em vez de criar um novo." }
    ClinicPatientRecord:
      type: object
      required: [patient, bookings, examinations, recommendations]
      description: "Ficha: só atividade da própria clínica (BR-CLN-03/17)."
      properties:
        patient: { $ref: "#/components/schemas/ClinicPatient" }
        bookings:
          type: array
          items: { $ref: "#/components/schemas/ClinicBooking" }
        examinations:
          type: array
          items: { $ref: "#/components/schemas/ClinicExamBooking" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/ClinicRecommendation" }
    ClinicSharedMedication:
      type: object
      required: [name, dosage, startAt, endAt, continuous]
      properties:
        name: { type: string }
        dosage: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, nullable: true }
        continuous: { type: boolean }
    ClinicSharedExamResult:
      type: object
      required: [parameter]
      properties:
        parameter: { type: string }
        valueNumeric: { type: number, nullable: true }
        valueText: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        referenceMin: { type: number, nullable: true }
        referenceMax: { type: number, nullable: true }
    ClinicSharedExam:
      type: object
      required: [name, examDate, status, results]
      properties:
        name: { type: string }
        examDate: { type: string, format: date }
        status: { type: string, enum: [SCHEDULED, COMPLETED] }
        results:
          type: array
          items: { $ref: "#/components/schemas/ClinicSharedExamResult" }
    ClinicSharedHistory:
      type: object
      required: [active, level, validUntil, medications, examinations]
      description: "BR-CLN-21. Só leitura. active=false (sem consentimento HISTORY válido) => listas vazias. Sem interpretação nem alertas por valor (D11); sem documentos nem notas."
      properties:
        active: { type: boolean }
        level: { type: string, enum: [BOOKINGS, HISTORY], nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        medications:
          type: array
          items: { $ref: "#/components/schemas/ClinicSharedMedication" }
        examinations:
          type: array
          items: { $ref: "#/components/schemas/ClinicSharedExam" }
    ClinicCalendarEntry:
      type: object
      required: [id, source, kind, status, startsAt, endsAt, patientName]
      description: "BR-CLN-23. Marcação do calendário; mínimo necessário (BR-CLN-03)."
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [VITA, MANUAL] }
        kind: { type: string, enum: [APPOINTMENT, EXAM] }
        status: { type: string, enum: [REQUESTED, SCHEDULED, REJECTED, COMPLETED, NO_SHOW, CANCELLED] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: "Fim da duração da marcação (de exame: o do horário)." }
        professionalId: { type: string, format: uuid, nullable: true }
        professionalName: { type: string, nullable: true }
        specialty: { type: string, nullable: true, description: "Serviço/especialidade; em exame, o tipo de exame." }
        patientName: { type: string }
        clinicPatientId: { type: string, format: uuid, nullable: true }
        slotId: { type: string, format: uuid, nullable: true }
        confirmationStatus:
          type: string
          nullable: true
          enum: [PENDING, CONFIRMED, DECLINED]
          description: "M14 Q. Nulo em exames."
        dayState:
          type: string
          nullable: true
          enum: [SCHEDULED, ARRIVED, IN_PROGRESS, COMPLETED, NO_SHOW, CANCELLED, REQUESTED, REJECTED]
          description: "M14 Q (BR-CLN-28). Nulo em exames."
        arrivedAt: { type: string, format: date-time, nullable: true }
        waitingMinutes: { type: integer, minimum: 0, nullable: true }
    ClinicCalendarFreeSlot:
      type: object
      required: [slotId, kind, startsAt, endsAt, specialty, remaining]
      properties:
        slotId: { type: string, format: uuid }
        kind: { type: string, enum: [APPOINTMENT, EXAM] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        professionalId: { type: string, format: uuid, nullable: true }
        professionalName: { type: string, nullable: true }
        specialty: { type: string }
        remaining: { type: integer, minimum: 1 }
    ClinicCalendar:
      type: object
      required: [from, to, entries, freeSlots]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ClinicCalendarEntry" }
        freeSlots:
          type: array
          items: { $ref: "#/components/schemas/ClinicCalendarFreeSlot" }
    ClinicSearchResult:
      type: object
      required: [patients, bookings]
      properties:
        patients:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ClinicPatient" }
        bookings:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ClinicCalendarEntry" }
    ClinicFollowUpRequest:
      type: object
      additionalProperties: false
      required: [amount, unit]
      properties:
        amount: { type: integer, minimum: 1, maximum: 24 }
        unit: { type: string, enum: [WEEKS, MONTHS] }
    ClinicFollowUp:
      type: object
      required: [bookingId, source, patientName, dueOn, patientNotified]
      description: "BR-CLN-30. Retorno por tratar; sem ids Vita."
      properties:
        bookingId: { type: string, format: uuid, description: "Id da consulta/visita de origem (usar nas rotas /agenda)." }
        source: { type: string, enum: [VITA, MANUAL] }
        clinicPatientId: { type: string, format: uuid, nullable: true }
        patientName: { type: string }
        patientPhone: { type: string, nullable: true, description: "Do registo da clínica (ClinicPatient), se existir." }
        dueOn: { type: string, format: date }
        patientNotified: { type: boolean, description: "Derivado: true se a marcação é Vita e hoje (CLINIC_TIMEZONE) >= dueOn - 7 dias, isto é, o alerta de retorno já é devido; sempre false em visitas manuais." }
    ReportCounts:
      type: object
      required: [slotsTotal, slotsBooked, completed, noShows, cancellations, declinedByPatient]
      description: "BR-CLN-29. Só contagens e taxas (0..1), sem PII."
      properties:
        slotsTotal: { type: integer, minimum: 0, description: "Soma das vagas (capacity) dos horários com startsAt na janela." }
        slotsBooked: { type: integer, minimum: 0, description: "Vagas ocupadas por marcações ativas ou realizadas (nunca > slotsTotal)." }
        occupancyRate: { type: number, minimum: 0, maximum: 1, nullable: true, description: "slotsBooked / slotsTotal; nulo se slotsTotal = 0." }
        completed: { type: integer, minimum: 0, description: "Consultas e visitas COMPLETED." }
        noShows: { type: integer, minimum: 0, description: "Consultas e visitas NO_SHOW." }
        noShowRate: { type: number, minimum: 0, maximum: 1, nullable: true, description: "noShows / (completed + noShows); nulo se o denominador é 0." }
        cancellations: { type: integer, minimum: 0, description: "Consultas e visitas CANCELLED (inclui pedidos desistidos e 'Não posso'; não inclui REJECTED)." }
        declinedByPatient: { type: integer, minimum: 0, description: "Subconjunto de cancellations com confirmationStatus=DECLINED ('Não posso')." }
    ClinicReportRow:
      allOf:
        - $ref: "#/components/schemas/ReportCounts"
        - type: object
          required: [professionalName]
          properties:
            professionalId: { type: string, format: uuid, nullable: true, description: "Nulo = 'sem profissional'." }
            professionalName: { type: string, nullable: true }
    ClinicReportSummary:
      type: object
      required: [from, to, totals, byProfessional]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals:
          allOf:
            - $ref: "#/components/schemas/ReportCounts"
            - type: object
              required: [newPatients, examsCompleted]
              properties:
                newPatients: { type: integer, minimum: 0, description: "ClinicPatient criados na janela (sempre da clínica inteira; não se filtra por profissional)." }
                examsCompleted: { type: integer, minimum: 0, description: "Exames COMPLETED com horário na janela." }
        byProfessional:
          type: array
          items: { $ref: "#/components/schemas/ClinicReportRow" }
          description: "Uma linha por profissional com horários ou marcações na janela (mais 'sem profissional'). Com professionalId só essa linha."
    ClinicRequestResponse:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [CONFIRM, REJECT]
        note:
          type: string
          nullable: true
          description: "Motivo, relevante só em REJECT."
    ClinicCancelRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
    ClinicCompleteAppointmentRequest:
      type: object
      properties:
        outcomeNote:
          type: string
          nullable: true
          description: "Resultado da consulta (BR-CLN-06)."
        prescription:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PrescriptionInput"
          description: "Opcional; se presente, cria a receita com issuedBy=CLINIC (BR-RX-07)."
        receipt:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ClinicCompleteReceiptInput"
          description: "«Concluir ato» (marco B fatia 3, BR-CLN-57): emite o recibo interno na mesma transação, depois de a consulta ficar COMPLETED. Só CLINIC_ADMIN/CLINIC_MANAGER (CLINIC_DOCTOR com `receipt` ⇒ FORBIDDEN sem efeito, BR-CLN-39)."
        report:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConsultationReportInput"
          description: "M15 S (BR-CLN-42/44). Opcional; presente = grava e finaliza o relatório na mesma transação (só CLINIC_DOCTOR da marcação; Admin/Gestor ⇒ FORBIDDEN, nada se grava). Ausente = o rascunho fica como está."
        examOrders:
          type: array
          nullable: true
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/ExamOrderItemInput" }
          description: "M15 U (BR-CLN-51). Opcional; cria 1-5 pedidos de exame na mesma transação da conclusão (só CLINIC_DOCTOR da marcação; Admin/Gestor => FORBIDDEN, nada se grava; >5 ativos => LIMIT_EXCEEDED)."
    ClinicDocumentView:
      type: object
      required: [id, originalName, sizeBytes, scanStatus, createdAt]
      description: "BR-CLN-08: só metadados; a clínica nunca descarrega."
      properties:
        generatedBySystem:
          type: boolean
          description: "M15 T (BR-CLN-49). true = laudo gerado pelo sistema (a clínica pode descarregá-lo); false = PDF carregado (só metadados)."
        id:
          type: string
          format: uuid
        originalName:
          type: string
        sizeBytes:
          type: integer
        scanStatus:
          type: string
          enum: [PENDING, CLEAN, INFECTED]
        createdAt:
          type: string
          format: date-time
    ClinicExamBooking:
      type: object
      required: [id, status, scheduledAt, patientName]
      description: "BR-CLN-03: mínimo necessário; nunca dados de saúde da família."
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED]
          description: "ADR-023 revisto: sem REQUESTED/REJECTED (o exame nasce SCHEDULED)."
        slotId:
          type: string
          format: uuid
          nullable: true
        scheduledAt:
          type: string
          format: date-time
        examType:
          type: string
          nullable: true
          description: "Tipo de exame do horário (ClinicSlot.specialty)."
        professionalName:
          type: string
          nullable: true
        patientName:
          type: string
        notes:
          type: string
          nullable: true
        responseNote:
          type: string
          nullable: true
        resultsCount:
          type: integer
          description: "Nº de parâmetros emitidos pela clínica (nunca os valores)."
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ClinicDocumentView"
        resultsIssuedAt:
          type: string
          format: date-time
          nullable: true
        receiptId:
          type: string
          format: uuid
          nullable: true
          description: "M14 R (BR-CLN-31). Recibo ISSUED do exame; nulo se não existe; nunca devolvido ao CLINIC_DOCTOR."
        hasResultsDraft:
          type: boolean
          description: "M15 T (BR-CLN-47). Existe rascunho de resultados (exame SCHEDULED)."
        reportAvailable:
          type: boolean
          description: "M15 T (BR-CLN-49). Existe laudo PDF gerado e descarregável em .../report/pdf."
        processId:
          type: string
          format: uuid
          nullable: true
          description: "Marco B fatia 1 (BR-PRC-06). Id do Process do exame (marcação Vita); nulo antes do backfill. Abre GET /clinic-portal/processes/{processId}."
    ClinicReceiptStatus:
      type: string
      enum: [ISSUED, VOIDED]
      description: "BR-CLN-33. ISSUED → VOIDED (irreversível)."
    ReceiptPaymentMethod:
      type: string
      enum: [CASH, CARD, TRANSFER, INSURANCE]
      description: "Informativo (BR-CLN-31): nada é cobrado nem integrado. INSURANCE é só uma etiqueta do recibo (sem operação de seguradora; ADR-037)."
    ClinicReceiptLinePublic:
      type: object
      required: [description, amountMinor]
      properties:
        description: { type: string, minLength: 1, maxLength: 120 }
        amountMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
    ClinicReceiptLine:
      type: object
      required: [position, description, amountMinor]
      properties:
        position: { type: integer, minimum: 1, maximum: 20 }
        description: { type: string, minLength: 1, maxLength: 120 }
        amountMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
        serviceTypeId: { type: string, format: uuid, nullable: true, description: "Origem no catálogo; nulo em linhas livres." }
    ClinicReceiptIssuer:
      type: object
      required: [name]
      description: "Retrato do perfil da clínica no momento da emissão (BR-CLN-31)."
      properties:
        name: { type: string }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
    ClinicReceipt:
      type: object
      required: [id, number, bookingKind, bookingId, status, paymentMethod, currency, totalMinor, patientName, issuer, lines, issuedAt, notice, availableToPatient]
      description: "Recibo interno não fiscal (M14 R, BR-CLN-31..35). Imutável salvo a anulação. Contém tudo o que é preciso para imprimir; sem ids Vita."
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1, description: "Sequencial por clínica, sem falhas (BR-CLN-32); apresentar como R- + 6 dígitos." }
        bookingKind: { type: string, enum: [APPOINTMENT, EXAM, VISIT] }
        bookingId: { type: string, format: uuid, description: "Id da consulta (agenda), do exame ou da visita da própria clínica." }
        status: { $ref: "#/components/schemas/ClinicReceiptStatus" }
        paymentMethod: { $ref: "#/components/schemas/ReceiptPaymentMethod" }
        currency: { type: string, description: "Moeda da clínica no momento (ISO 4217)." }
        totalMinor: { type: integer, format: int64, minimum: 1, maximum: 100000000000, description: "Soma das linhas, em cêntimos." }
        patientName: { type: string, description: "Retrato do nome na marcação (BR-CLN-03)." }
        note: { type: string, nullable: true, maxLength: 200 }
        issuer: { $ref: "#/components/schemas/ClinicReceiptIssuer" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ClinicReceiptLine" }
          minItems: 1
          maxItems: 20
        issuedAt: { type: string, format: date-time }
        issuedByClinicAccountId: { type: string, format: uuid, nullable: true }
        voidedAt: { type: string, format: date-time, nullable: true }
        voidReason: { type: string, nullable: true, description: "Interno da clínica; nunca vai ao paciente." }
        voidedByClinicAccountId: { type: string, format: uuid, nullable: true }
        notice: { type: string, description: "Texto fixo obrigatório: 'Documento não fiscal — não substitui fatura'." }
        availableToPatient: { type: boolean, description: "Existe ligação ao paciente Vita (consentimento na emissão, BR-CLN-35)." }
    ClinicReceiptLineInput:
      type: object
      additionalProperties: false
      description: "Linha do catálogo (serviceTypeId; descrição e valor vêm do catálogo, amountMinor opcional ajusta) ou livre (description + amountMinor)."
      properties:
        serviceTypeId: { type: string, format: uuid }
        description: { type: string, minLength: 1, maxLength: 120 }
        amountMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
    ClinicReceiptInput:
      type: object
      additionalProperties: false
      required: [bookingKind, bookingId, paymentMethod]
      properties:
        bookingKind: { type: string, enum: [APPOINTMENT, EXAM, VISIT] }
        bookingId: { type: string, format: uuid }
        paymentMethod: { $ref: "#/components/schemas/ReceiptPaymentMethod" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ClinicReceiptLineInput" }
          minItems: 1
          maxItems: 20
          description: "Omitido ⇒ uma linha com o serviço do horário da marcação (preço do catálogo); sem serviço ⇒ VALIDATION_ERROR."
        note: { type: string, maxLength: 200 }
    ClinicCompleteReceiptInput:
      type: object
      additionalProperties: false
      required: [paymentMethod]
      description: "Como ClinicReceiptInput, sem bookingKind/bookingId (é a própria consulta que se conclui)."
      properties:
