      operationId: getClinicConsultationReport
      summary: "Ver o relatório da consulta (rascunho ou final)."
      description: "Autorização: CLINIC_ACCOUNT. M15 S, BR-CLN-41/44, UC-CLN-35. Admin e Gestor leem qualquer marcação da clínica; o Médico só as suas (outra ⇒ NOT_FOUND). Sem relatório ⇒ NOT_FOUND (a lista de marcações indica `reportStatus`). Leitura auditada (CONSULT_REPORT_VIEWED, sem texto)."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          description: "Id de uma consulta Vita ou de uma visita manual da clínica (despacho pelo id, BR-CLN-18)."
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationReport" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (marcação/relatório inexistente, de outra clínica ou de outro profissional)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    put:
      tags: [Clinic Portal]
      operationId: saveClinicConsultationReport
      summary: "Guardar o rascunho do relatório da consulta."
      description: "Autorização: CLINIC_DOCTOR (marcações do seu profissional); CLINIC_ADMIN e CLINIC_MANAGER ⇒ FORBIDDEN. M15 S, BR-CLN-41/42/44, UC-CLN-32. Cria ou atualiza o rascunho (última escrita ganha). Marcação SCHEDULED ou COMPLETED sem relatório FINAL; relatório FINAL ⇒ INVALID_STATE_TRANSITION (usar adenda). `sharedWithPatient` omitido mantém o valor (omissão true; visita manual ⇒ sempre false). Rate limit 60/min por conta. Auditoria CONSULT_REPORT_SAVED."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          description: "Id de uma consulta Vita ou de uma visita manual da clínica (despacho pelo id, BR-CLN-18)."
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsultationReportInput" }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationReport" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '403':
          description: "FORBIDDEN (papel sem escrita)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "INVALID_STATE_TRANSITION (relatório FINAL ou marcação cancelada/faltou/pedida)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (nenhuma secção preenchida, limites, caracteres de controlo)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
