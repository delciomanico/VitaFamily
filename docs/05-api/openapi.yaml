    put:
      tags: [Clinic Portal]
      operationId: saveClinicExamResultsDraft
      summary: "Guardar (criar ou substituir) o rascunho de resultados sem concluir o exame."
      description: "Autorização: CLINIC_ACCOUNT (Admin, Gestor; Médico os seus). M15 T, BR-CLN-47. Exame SCHEDULED da própria clínica; o exame continua SCHEDULED e não há exam_results. Substitui o rascunho anterior. Rate limit 60/min por conta. Auditoria EXAM_RESULTS_DRAFT_SAVED (sem valores)."
      security:
        - clinicBearerAuth: []
      parameters:
        - { name: examinationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicExamResultsDraftInput" }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicExamResultsDraft" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "INVALID_STATE_TRANSITION (exame não SCHEDULED)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (sem resultados nem nota, limites, referência min > max)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [Clinic Portal]
