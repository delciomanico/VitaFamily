          description: "FORBIDDEN"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "INVALID_STATE_TRANSITION"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token de User (claims userId/sessionId/familyId?). Nunca aceite em /clinic-portal/*."
    clinicBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "D17/D18, ADR-020. Token de ClinicAccount (claims clinicAccountId/clinicId/role e, em CLINIC_DOCTOR, professionalId), só para /clinic-portal/*. Papéis CLINIC_ADMIN, CLINIC_MANAGER (receção) e CLINIC_DOCTOR (M14 R): o papel restringe as rotas segundo authorization.md §6.2b (papel insuficiente ⇒ 403 FORBIDDEN mesmo que a rota não o declare; o Médico só vê marcações/pacientes do seu profissional, o resto ⇒ 404 NOT_FOUND). Nunca aceite nas restantes rotas, mesmo que a assinatura seja válida (claims distintas)."
    professionalBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "ADR-037, ADR-020. Token de ProfessionalAccount (claims professionalAccountId/professionalId/sid), só para /professional-portal/*. O estado de validação do profissional restringe as escritas (authorization.md §10.2). Nunca aceite nas restantes rotas, mesmo que a assinatura seja válida (claims distintas); tokens de User e de ClinicAccount nunca são aceites em /professional-portal/*."
