        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '423':
          description: "MEMBER_BLOCKED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/processes/{processId}:
    get:
      tags: [Clinic Portal]
      operationId: getClinicProcess
      summary: "Ler o processo do atendimento da própria clínica (mínimo necessário)."
      description: |
        Autorização: CLINIC_ACCOUNT, papéis CLINIC_ADMIN e CLINIC_MANAGER (authorization.md §6.2b); CLINIC_DOCTOR ⇒ 403 FORBIDDEN. O processo tem de ter `clinic_id` = clínica do token; inexistente, de outra clínica ou sem clínica ⇒ `404 NOT_FOUND` (BR-PRC-06). Devolve só id, tipo, origem, abertura e fase do ato — nunca `memberId`/`familyId`, `familyStatus` nem `nextStep`. Não auditada (leitura de ato próprio, como a agenda). Sem rate limit específico.
      security:
