          type: string
          enum: [APPOINTMENT, EXAM]
          description: "Consulta (APPOINTMENT) ou exame (EXAM); mesmo enum de ClinicSlot.kind. Imutável."
        durationMinutes: { type: integer, enum: [15, 20, 30, 45, 60] }
        priceMinor:
          type: integer
