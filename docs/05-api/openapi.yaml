          minimum: 0
          maximum: 100000000000
          nullable: true
          description: "Preço em cêntimos (inteiro), opcional, só informativo nesta fase (BR-CLN-12)."
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          readOnly: true
          description: "Moeda da clínica (clinics.currency; AOA por omissão). Só leitura em M14 a1/a2."
        active: { type: boolean }
    ClinicServiceTypeInput:
      type: object
      additionalProperties: false
      required: [name, kind, durationMinutes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [APPOINTMENT, EXAM] }
        durationMinutes: { type: integer, enum: [15, 20, 30, 45, 60] }
        priceMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000, nullable: true }
