      description: "Autorização: PLATFORM_ADMIN. BR-ADM-05 (completa ADR-021): nome e/ou NIF (único); auditado (ADMIN_INSURER_UPDATE). Não há eliminação (schema.md §8). ADR-023."
      parameters:
        - { name: insurerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InsurerPatch" }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Insurer" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '403':
          description: "FORBIDDEN"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (inclui NIF duplicado)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /admin/insurers/{insurerId}/status:
    put:
      tags: [Admin]
      operationId: adminSetInsurerStatus
      summary: "Suspender/reativar seguradora parceira."
      description: "Autorização: PLATFORM_ADMIN. ADR-021 (mirror de adminSetClinicStatus)."
      parameters:
