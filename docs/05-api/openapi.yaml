      operationId: setAppointmentConfirmation
      summary: "Responder ao pedido de confirmação: 'Vou' ou 'Não posso' (cancela)."
      description: "Autorização: WRITE(APPOINTMENTS) (como setAppointmentStatus). M14 Q, BR-CLN-25/26, UC-CLN-20. Só consultas SCHEDULED, futuras, de clínica parceira (com slotId). GOING -> confirmationStatus=CONFIRMED; CANNOT -> consulta CANCELLED + confirmationStatus=DECLINED (liberta o horário, BR-APT-06); remarcar é o fluxo existente (novo pedido de horário, BR-APT-09). Idempotente (repetir a mesma resposta -> 200). GOING depois de CANNOT -> INVALID_STATE_TRANSITION."
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
