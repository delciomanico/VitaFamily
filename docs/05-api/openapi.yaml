      summary: "Criar ou repor a conta INSURANCE_ADMIN raiz de uma seguradora parceira."
      description: "Autorização: PLATFORM_ADMIN. BR-INS-06: única via do Platform Admin para o portal da seguradora; não cria nem lista INSURANCE_AGENT. Idempotente por seguradora (repor substitui a credencial da conta INSURANCE_ADMIN existente, nunca cria uma segunda). ADR-021."
      parameters:
        - { name: insurerId, in: path, required: true, schema: { type: string, format: uuid } }
