        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (outra clínica ou inexistente)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      tags: [Clinic Portal]
      operationId: updateClinicPatient
      summary: "Editar um paciente da clínica."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). UC-CLN-14, BR-CLN-17. Campos opcionais aceitam null para limpar; name não. origin e vitaLink não são editáveis. Auditoria CLINIC_PATIENT_UPDATE (lista dos campos alterados, sem valores)."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicPatientPatch" }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicPatient" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR"
          content:
            application/problem+json:
