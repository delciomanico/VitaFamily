components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token de User (claims userId/sessionId/familyId?). Nunca aceite em /clinic-portal/*."
    clinicBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "D17/D18, ADR-020. Token de ClinicAccount (claims clinicAccountId/clinicId/role e, em CLINIC_DOCTOR, professionalId), só para /clinic-portal/*. Papéis CLINIC_ADMIN, CLINIC_MANAGER (receção) e CLINIC_DOCTOR (M14 R): o papel restringe as rotas segundo authorization.md §6.2b (papel insuficiente ⇒ 403 FORBIDDEN mesmo que a rota não o declare; o Médico só vê marcações/pacientes do seu profissional, o resto ⇒ 404 NOT_FOUND). Nunca aceite nas restantes rotas, mesmo que a assinatura seja válida (claims distintas)."
    insuranceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "ADR-021. Token de InsuranceAccount (claims insuranceAccountId/insurerId/role), só para /insurance-portal/*. Nunca aceite nas restantes rotas, mesmo que a assinatura seja válida (claims distintas)."
  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
          nullable: true
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, name, birthDate, timezone, termsVersion]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
        birthDate:
          type: string
          format: date
        timezone:
          type: string
        termsVersion:
          type: string
        invitationToken:
          type: string
          nullable: true
          description: >-
            Token de um convite pendente (UC-MEM-03/UC-MEM-05). Se resolver para um convite tipo
            `DEPENDENT_ACCOUNT`, a data de nascimento vem do perfil (BR-MEM-17) e a idade mínima de
            autorregisto não se aplica. Se resolver para um convite tipo `MEMBER` (change control,
            docs/03-use-cases/member.md), a conta é criada E o convite é aceite automaticamente no
            mesmo pedido — liga à conta o `FamilyMember` do convite (perfil existente ou um novo)
            com papel FAMILY_MEMBER, sem exigir login + `POST /invitations/accept` manuais em
            separado; a idade mínima de autorregisto (18 anos, BR-ACC-02) aplica-se normalmente a
            `birthDate`. Em ambos os casos, `email` tem de coincidir com o do convite
            (`INVITATION_EMAIL_MISMATCH` caso contrário).
    VerifyEmailRequest:
      type: object
      required: [email, token]
      properties:
        email:
          type: string
          format: email
        token:
          type: string
          description: "Código de 6 dígitos enviado por e-mail (ADR-018)."
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
