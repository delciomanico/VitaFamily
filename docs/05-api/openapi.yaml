        reasons: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/RankingReason" } }
        label: { type: string, enum: [NEW], description: "NEW («Novo») enquanto não existirem avaliações verificadas (MK3, BR-MKT-04). Conjunto aberto." }
    MarketplaceProfessionalItem:
      type: object
      required: [id, displayName, city, specialties, matchingOffers, fromPriceKz]
      description: "Cartão da pesquisa (BR-MKT-33/34). Sem e-mail, pagamento nem dados internos."
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        city: { type: string }
        specialties: { type: array, items: { $ref: "#/components/schemas/Specialty" } }
        matchingOffers: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MarketplaceOffer" } }
        fromPriceKz: { type: integer, minimum: 0, description: "Menor preço entre as ofertas que correspondem aos filtros." }
        nextAvailableAt: { type: string, format: date-time, nullable: true, description: "Primeiro horário futuro das ofertas correspondentes." }
        ranking: { allOf: [{ $ref: "#/components/schemas/RankingExplanation" }], type: object, nullable: true, description: "Só com specialtyId no pedido." }
    MarketplaceProfessionalPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MarketplaceProfessionalItem" } }
        nextCursor: { type: string, nullable: true }
    MarketplaceProfessionalProfile:
      type: object
      required: [id, displayName, city, specialties, offers]
      description: "Perfil público para famílias (BR-MKT-34). Nunca e-mail, paymentInstructions, credenciais, estado de validação nem contagens internas."
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        bio: { type: string, nullable: true, maxLength: 1000 }
        city: { type: string }
        specialties: { type: array, items: { $ref: "#/components/schemas/Specialty" } }
        offers: { type: array, items: { $ref: "#/components/schemas/MarketplaceOffer" }, description: "Todas as ofertas ativas." }
        nextAvailableAt: { type: string, format: date-time, nullable: true }
        memberSince: { type: string, format: date, description: "Primeiro dia do mês da primeira aprovação." }
        ranking: { allOf: [{ $ref: "#/components/schemas/RankingExplanation" }], type: object, nullable: true, description: "Só com ?specialtyId= de uma especialidade do profissional." }
    ComparisonItem:
      type: object
      required: [professionalId, displayName, city, offers, fromPriceKz]
      properties:
        professionalId: { type: string, format: uuid }
        displayName: { type: string }
        city: { type: string }
        offers: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MarketplaceOffer" }, description: "Ofertas ativas na especialidade comparada, por método e duração." }
        fromPriceKz: { type: integer, minimum: 0 }
        nextAvailableAt: { type: string, format: date-time, nullable: true }
    MethodPriceSummary:
      type: object
      required: [method, minPriceKz, maxPriceKz, cheapestProfessionalIds]
      properties:
        method: { $ref: "#/components/schemas/OfferMethod" }
        minPriceKz: { type: integer, minimum: 0 }
        maxPriceKz: { type: integer, minimum: 0 }
        cheapestProfessionalIds: { type: array, minItems: 1, items: { type: string, format: uuid }, description: "Todos os profissionais com o preço mínimo do método (empates incluídos)." }
    ProfessionalComparison:
      type: object
      required: [specialtyId, items, priceSummary]
      description: "Comparação de preços lado a lado em Kz (BR-MKT-35). Sem estado no servidor; sem pontuação do ranking."
      properties:
        specialtyId: { type: string, format: uuid }
        items: { type: array, minItems: 2, maxItems: 3, items: { $ref: "#/components/schemas/ComparisonItem" } }
        priceSummary: { type: array, items: { $ref: "#/components/schemas/MethodPriceSummary" } }
    MarketplaceFilters:
      type: object
      required: [specialties, cities, methods]
      properties:
        specialties:
          type: array
          items:
            type: object
            required: [id, name, category, professionalCount]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              category: { $ref: "#/components/schemas/SpecialtyCategory" }
              professionalCount: { type: integer, minimum: 1 }
        cities:
          type: array
          items:
            type: object
            required: [name, professionalCount]
            properties:
              name: { type: string, description: "Valor a enviar em city (grafia mais frequente)." }
              professionalCount: { type: integer, minimum: 1 }
        methods: { type: array, items: { $ref: "#/components/schemas/OfferMethod" } }
    RankingRules:
      type: object
      required: [version, signals, notUsed, statement]
      description: "Regras públicas do ranking («Como ordenamos», BR-MKT-36/37). Estático e versionado."
      properties:
        version: { type: string, example: "v1" }
        signals:
          type: array
          items:
            type: object
            required: [code, weightPercent, description]
            properties:
              code: { type: string, enum: [PROFILE_COMPLETENESS, AVAILABILITY, PRICE, SENIORITY] }
              weightPercent: { type: integer, minimum: 0, maximum: 100 }
              description: { type: string }
        notUsed: { type: array, items: { type: string }, description: "O que nunca influencia a ordem (pagamento, destaques, ordem manual, dados pessoais)." }
        statement: { type: string, description: "Frase pública: o pagamento e os destaques pagos nunca influenciam a ordem." }
    ConversationStatus:
      type: string
      enum: [OPEN, CLOSED]
    ConversationClosedBy:
      type: string
      enum: [FAMILY, PROFESSIONAL, SYSTEM]
    ConversationProfessional:
      type: object
      required: [id, displayName]
      description: "Identidade pública do profissional (a mesma do perfil público)."
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        city: { type: string, nullable: true }
    FamilyConversation:
      type: object
      required: [id, memberId, professional, participantLabel, status, canSend, lastMessageAt, unreadCount, createdAt]
      description: "Conversa vista pela família (BR-MKT-38/47). canSend é derivado: OPEN e profissional APPROVED."
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid, description: "Membro-sujeito (o titular ou o dependente)." }
        professional: { $ref: "#/components/schemas/ConversationProfessional" }
        participantLabel: { type: string, minLength: 1, maxLength: 40 }
        status: { $ref: "#/components/schemas/ConversationStatus" }
        closedBy: { type: string, nullable: true, enum: [FAMILY, PROFESSIONAL, SYSTEM, null] }
        canSend: { type: boolean }
        lastMessageAt: { type: string, format: date-time }
        unreadCount: { type: integer, minimum: 0, description: "Mensagens do profissional com seq > familyReadSeq." }
        createdAt: { type: string, format: date-time }
    FamilyConversationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FamilyConversation" } }
        nextCursor: { type: string, nullable: true }
    ProfessionalConversation:
      type: object
      required: [id, participantLabel, status, canSend, lastMessageAt, unreadCount, createdAt]
      description: "Conversa vista pelo profissional: NUNCA contém ids de família, membro ou utilizador (BR-MKT-10/38)."
      properties:
        id: { type: string, format: uuid }
        participantLabel: { type: string, minLength: 1, maxLength: 40 }
        status: { $ref: "#/components/schemas/ConversationStatus" }
        closedBy: { type: string, nullable: true, enum: [FAMILY, PROFESSIONAL, SYSTEM, null] }
        canSend: { type: boolean, description: "OPEN e o próprio profissional APPROVED." }
        lastMessageAt: { type: string, format: date-time }
        unreadCount: { type: integer, minimum: 0, description: "Mensagens da família com seq > professionalReadSeq." }
        createdAt: { type: string, format: date-time }
    ProfessionalConversationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProfessionalConversation" } }
        nextCursor: { type: string, nullable: true }
    ChatMessage:
      type: object
      required: [id, seq, side, mine, hidden, createdAt, readByOtherSide]
      description: "Mensagem de texto (BR-MKT-39). text é nulo quando hidden=true (moderação). Dado de saúde potencial: fora de logs (BR-MKT-46). Nunca contém o id do utilizador que escreveu."
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        side: { type: string, enum: [FAMILY, PROFESSIONAL] }
        mine: { type: boolean, description: "Escrita pelo próprio utilizador (família: o próprio User; profissional: o lado PROFESSIONAL)." }
        text: { type: string, nullable: true, minLength: 1, maxLength: 1000 }
        hidden: { type: boolean }
        createdAt: { type: string, format: date-time }
        readByOtherSide: { type: boolean, description: "seq ≤ marcador de leitura do outro lado." }
    ChatMessagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ChatMessage" }, description: "seq decrescente." }
        nextCursor: { type: string, nullable: true }
    StartConversationRequest:
      type: object
      additionalProperties: false
      required: [professionalId, participantLabel, text]
      properties:
        professionalId: { type: string, format: uuid }
        participantLabel: { type: string, minLength: 1, maxLength: 40, description: "Como a família quer ser tratada; é tudo o que o profissional vê (OP-75). Ignorado se a conversa já existir." }
        text: { type: string, minLength: 1, maxLength: 1000 }
        clientMessageId: { type: string, format: uuid }
    ConversationStarted:
      type: object
      required: [conversation, message]
      properties:
        conversation: { $ref: "#/components/schemas/FamilyConversation" }
        message: { $ref: "#/components/schemas/ChatMessage" }
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000, description: "Texto simples; sem anexos, HTML nem formatação (BR-MKT-39)." }
        clientMessageId: { type: string, format: uuid, description: "Idempotência do envio (rede instável)." }
    MarkReadRequest:
      type: object
      additionalProperties: false
      properties:
        upToSeq: { type: integer, minimum: 0, description: "Omitido = a última mensagem. O marcador nunca recua." }
    MessageReportReason:
      type: string
      enum: [ABUSE, SPAM, SCAM_OR_OFF_PLATFORM_PAYMENT, SENSITIVE_DATA, OTHER]
    ReportMessageRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/MessageReportReason" }
        note: { type: string, minLength: 1, maxLength: 300, description: "Opcional; escrita pelo denunciante; visível ao admin." }
    MessageReportReceipt:
      type: object
      required: [id, status, reason, createdAt]
      description: "Vista do denunciante: estado, não o motivo da decisão."
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, DECIDED] }
        reason: { $ref: "#/components/schemas/MessageReportReason" }
        createdAt: { type: string, format: date-time }
    MessageReportDecision:
      type: string
      enum: [DISMISS, HIDE_MESSAGE, HIDE_AND_CLOSE]
    MessageReportDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/MessageReportDecision" }
    AdminMessageReportItem:
      type: object
      required: [id, status, reason, reportedSide, professionalId, professionalDisplayName, createdAt]
      description: "Sem o texto da mensagem (BR-MKT-44)."
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, DECIDED] }
        reason: { $ref: "#/components/schemas/MessageReportReason" }
        reportedSide: { type: string, enum: [FAMILY, PROFESSIONAL], description: "Lado que escreveu a mensagem denunciada." }
        professionalId: { type: string, format: uuid }
        professionalDisplayName: { type: string }
        createdAt: { type: string, format: date-time }
    AdminMessageReportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminMessageReportItem" } }
        nextCursor: { type: string, nullable: true }
    AdminReportContextMessage:
      type: object
      required: [id, seq, side, text, hidden, createdAt]
      description: "OP-76: mensagem de contexto de uma denúncia. Sem ids de utilizador, família ou membro."
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        side: { type: string, enum: [FAMILY, PROFESSIONAL] }
        text: { type: string, nullable: true, description: "Nulo se a mensagem já foi ocultada por moderação (hidden=true)." }
        hidden: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminMessageReportDetail:
      type: object
      required: [id, status, reason, reportedSide, professional, message, contextBefore, createdAt]
      description: "BR-MKT-44 (OP-76): a mensagem denunciada mais, no máximo, 2 mensagens de contexto (as imediatamente anteriores da mesma conversa); nunca família, membro, participantLabel nem outras mensagens. A leitura é auditada."
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, DECIDED] }
        reason: { $ref: "#/components/schemas/MessageReportReason" }
        note: { type: string, nullable: true, maxLength: 300 }
        reportedSide: { type: string, enum: [FAMILY, PROFESSIONAL] }
        professional: { $ref: "#/components/schemas/ConversationProfessional" }
        reportedUserId: { type: string, format: uuid, nullable: true, description: "Só se a mensagem for do lado da família e o utilizador ainda existir; para usar a suspensão de conta já existente (ADR-023) (OP-76)." }
        message:
          type: object
          required: [id, text, hidden, createdAt]
          properties:
            id: { type: string, format: uuid }
            text: { type: string, description: "Texto original da mensagem denunciada (o admin vê-o mesmo que já esteja oculta para os participantes)." }
            hidden: { type: boolean }
            createdAt: { type: string, format: date-time }
        contextBefore:
          type: array
          maxItems: 2
          description: "OP-76: no máximo as 2 mensagens imediatamente anteriores à denunciada na mesma conversa (maior seq estritamente inferior; ordem cronológica crescente). Vazio se a denunciada for a 1.ª. Nunca posteriores nem de outras conversas."
          items: { $ref: "#/components/schemas/AdminReportContextMessage" }
        decision: { type: string, nullable: true, enum: [DISMISS, HIDE_MESSAGE, HIDE_AND_CLOSE, null] }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
