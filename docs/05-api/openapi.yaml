  /families/{familyId}/members/{memberId}/processes:
    get:
      tags: [Processes]
      operationId: listProcesses
      summary: "Listar os processos (atos) de um membro, com estado simples para a família."
      description: |
        Autorização: READ da categoria da origem de cada processo (APPOINTMENTS para consulta, EXAMS para exame; authorization.md §6.8). A lista **filtra** (omite) os processos cuja categoria o actor não pode ler (§5.3); DEPENDENT_SELF vê só os de consulta; OTHER só com SharingGrant da categoria. Sem nenhuma leitura permitida devolve lista vazia.
        `familyStatus` e `nextStep` são **derivados** em leitura por deriveFamilyStatus(facts) (BR-PRC-02/03); não existem na BD nem em escrita.
        Sem rotas de escrita. O `nextStep` reflete só o ato (consulta/exame); não há vista de cobertura (arquivo do marco B, ADR-037).
        Ordenação fixa: `openedAt` decrescente, depois `id` decrescente. `status` é filtrado **depois** da derivação: o servidor percorre a BD em lotes (máx. 200 processos por pedido) e devolve até `limit` itens; se o limite de varrimento for atingido com menos itens, `nextCursor` continua não nulo — o cliente segue `nextCursor` até ser nulo. Processos cujo ato já não existe são omitidos (BR-PRC-09). Leitura por quem não é o titular é auditada (PROCESS_VIEW). Sem rate limit específico (limite global da API).
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProcessFamilyStatus" }
        - name: originType
          in: query
          schema: { $ref: "#/components/schemas/ProcessOriginType" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessPage" }
        '400':
          description: "MALFORMED_REQUEST (query inválida: status/originType/limit fora do contrato ou cursor inválido; convenção da plataforma para parâmetros de pedido)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (família/membro de outra família ou inexistente)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '423':
          description: "MEMBER_BLOCKED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /families/{familyId}/members/{memberId}/processes/{processId}:
    get:
      tags: [Processes]
      operationId: getProcess
      summary: "Detalhe de um processo (estado simples e o que falta e de quem)."
      description: |
        Autorização: READ da categoria da origem do processo (authorization.md §6.8). Processo inexistente, de outro membro/família **ou cuja categoria o actor não pode ler** ⇒ `404 NOT_FOUND` (sem enumeração, BR-PRC-05). Leitura por quem não é o titular é auditada (PROCESS_VIEW).  Sem rate limit específico.
      parameters:
