openapi: 3.0.3
info:
  title: Vita Family API
  version: 0.1.0
  description: |
    Contrato REST do backend Vita Family (MVP). Fonte de verdade da API; gerado a partir de docs/05-api (Fase 13).
    Todas as rotas de negócio usam o prefixo /api/v1. Autorização por papel + relação + partilha (ver docs/02-users/permissions.md).
    Erros: application/problem+json com campo `code` estável (ver errors.md).
servers:
  - url: https://vitafamily.cassfrei.com/api/v1
    description: Produção (ADR-012)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Families
  - name: Members
  - name: Invitations
  - name: Sharing
  - name: Health records
  - name: Prescriptions
  - name: Medications
  - name: Appointments
  - name: Clinics
  - name: Examinations
  - name: Documents
  - name: Alerts
  - name: Reports
  - name: Admin
  - name: Operations
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: "Registar conta (ou aceitar convite de conta de dependente)."
      description: "Autorização: PUBLIC. BR-ACC-01/02, BR-MEM-12; resposta neutra mesmo que o e-mail já exista (sem enumeração); envia e-mail de verificação; regista termos."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        '202':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '404':
          description: "INVITATION_INVALID"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '410':
          description: "INVITATION_EXPIRED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "AGE_REQUIREMENT_NOT_MET | DEPENDENT_ACCOUNT_AGE | PASSWORD_WEAK | VALIDATION_ERROR"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: "Verificar e-mail com token de uso único (24 h)."
      description: "Autorização: PUBLIC. Passa o utilizador a ACTIVE."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        '204':
          description: Sem conteúdo
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: "Reenviar e-mail de verificação."
      description: "Autorização: PUBLIC. Resposta neutra; invalida token anterior."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendVerificationRequest" }
      responses:
        '202':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '429':
          description: "RATE_LIMITED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: "Iniciar sessão."
      description: "Autorização: PUBLIC. Devolve access token e define cookie `refresh_token` (HttpOnly, Secure, SameSite=Strict, caminho `/api/v1/auth`). Audita sucesso e falha."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        '401':
          description: "AUTH_INVALID_CREDENTIALS"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '403':
          description: "ACCOUNT_SUSPENDED | EMAIL_NOT_VERIFIED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: "Rodar refresh token e obter novo access token."
      description: "Autorização: PUBLIC (cookie). Exige cabeçalho `X-Requested-With: vita`; reutilização de refresh antigo revoga toda a cadeia."
      security: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '403':
          description: "ACCOUNT_SUSPENDED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: "Terminar sessão atual."
      description: "Autorização: AUTH. Revoga o refresh token e limpa o cookie."
      responses:
        '204':
          description: Sem conteúdo
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: "Pedir recuperação de palavra-passe."
      description: "Autorização: PUBLIC. Resposta idêntica exista ou não a conta; link de uso único válido 1 h."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        '202':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '429':
          description: "RATE_LIMITED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: "Definir nova palavra-passe com token."
      description: "Autorização: PUBLIC. Revoga todas as sessões (BR UC-ACC-03)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        '204':
          description: Sem conteúdo
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "PASSWORD_WEAK | VALIDATION_ERROR"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: "Alterar palavra-passe (derivado de FR-AUTH)."
      description: "Autorização: AUTH. Revoga as outras sessões."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        '204':
          description: Sem conteúdo
        '401':
          description: "AUTH_INVALID_CREDENTIALS | UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "PASSWORD_WEAK"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /users/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: "Ver a minha conta."
      description: "Autorização: AUTH."
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      tags: [Users]
      operationId: updateMe
      summary: "Alterar nome e fuso horário."
      description: "Autorização: AUTH. Mudar fuso recalcula tomas futuras (BR-MED-08)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [Users]
      operationId: deleteMe
      summary: "Eliminar a minha conta (hard delete)."
      description: "Autorização: AUTH. BR-ACC-06/07, D15: confirmação por palavra-passe; apaga dados e documentos; anonimiza auditoria. Disponível mesmo com termos por aceitar."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        '204':
          description: Sem conteúdo
        '401':
          description: "AUTH_INVALID_CREDENTIALS | UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "ACCOUNT_DELETION_BLOCKED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /users/me/terms-acceptance:
    post:
      tags: [Users]
      operationId: acceptTerms
      summary: "Aceitar a versão atual dos termos."
      description: "Autorização: AUTH. B6."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptTermsRequest" }
      responses:
        '204':
          description: Sem conteúdo
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /users/me/notification-preferences:
    get:
      tags: [Users]
      operationId: getNotificationPreferences
      summary: "Ver preferências de notificação."
      description: "Autorização: AUTH."
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    put:
      tags: [Users]
      operationId: putNotificationPreferences
      summary: "Definir canais e tipos de alerta."
      description: "Autorização: AUTH. R9, Q3: pode desativar alertas de toma."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferences" }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /users/me/push-subscriptions:
    post:
      tags: [Users]
      operationId: addPushSubscription
      summary: "Registar subscrição Web Push."
      description: "Autorização: AUTH. UC-ALR-06; endpoint repetido atualiza a existente."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionRequest" }
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /users/me/push-subscriptions/{subscriptionId}:
    delete:
      tags: [Users]
      operationId: deletePushSubscription
      summary: "Remover subscrição Web Push."
      description: "Autorização: AUTH."
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Sem conteúdo
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /users/me/exports:
    post:
      tags: [Users]
      operationId: requestMyExport
      summary: "Pedir exportação dos meus dados (JSON + documentos)."
      description: "Autorização: AUTH. FR-PRIV-05, N7, Q6: gerada em segundo plano; máx. 3 pedidos por dia."
      responses:
        '202':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExport"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /users/me/exports/{exportId}:
    get:
      tags: [Users]
      operationId: getMyExport
      summary: "Estado de uma exportação."
      description: "Autorização: AUTH."
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExport"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /users/me/exports/{exportId}/download:
    get:
      tags: [Users]
      operationId: downloadMyExport
      summary: "Descarregar pacote da exportação (zip)."
      description: "Autorização: AUTH. Válido 7 dias; auditado."
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "EXPORT_NOT_READY"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /families:
    post:
      tags: [Families]
      operationId: createFamily
      summary: "Criar família."
      description: "Autorização: AUTH. FR-FAM-01: cria o FamilyMember do utilizador como FAMILY_ADMIN; máx. 5 famílias (B4)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFamilyRequest" }
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "LIMIT_EXCEEDED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    get:
      tags: [Families]
      operationId: listFamilies
      summary: "Listar as minhas famílias."
      description: "Autorização: AUTH."
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Family" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /families/{familyId}:
    get:
      tags: [Families]
      operationId: getFamily
      summary: "Ver família."
      description: "Autorização: FAM_MEMBER."
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      tags: [Families]
      operationId: updateFamily
      summary: "Alterar nome da família."
      description: "Autorização: FAM_ADMIN."
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFamilyRequest" }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '403':
          description: "FORBIDDEN"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [Families]
      operationId: deleteFamily
      summary: "Eliminar família."
      description: "Autorização: FAM_ADMIN. R2: só com um único membro; apaga tudo (cascata + ficheiros)."
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Sem conteúdo
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '403':
          description: "FORBIDDEN"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "FAMILY_NOT_EMPTY"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /families/{familyId}/leave:
    post:
      tags: [Families]
      operationId: leaveFamily
      summary: "Sair da família (adulto), levando ou apagando os dados."
      description: "Autorização: FAM_MEMBER. R4, Q5, P8: menores/dependentes com conta não saem sozinhos; TAKE gera exportação e só apaga depois de pronta."
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaveFamilyRequest" }
      responses:
        '202':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveFamilyResult"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '403':
          description: "FORBIDDEN"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "LAST_ADMIN | LAST_GUARDIAN"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /families/{familyId}/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: "Listar membros."
      description: "Autorização: FAM_MEMBER. Nome e data de nascimento visíveis a todos (BR-PRV-10); dependente com conta só vê nomes (P5)."
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    post:
      tags: [Members]
      operationId: createMember
      summary: "Criar perfil de membro sem conta."
      description: "Autorização: FAM_ADMIN. UC-MEM-01, Q7: adulto sem conta só como dependente; máx. 20 membros."
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMemberRequest" }
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '403':
          description: "FORBIDDEN"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "LIMIT_EXCEEDED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
