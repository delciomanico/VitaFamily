          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicExamResultsDraft" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
