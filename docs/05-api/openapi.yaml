      summary: "Completar o exame: registar resultados estruturados (e/ou PDF já carregado)."
      description: "Autorização: CLINIC_ACCOUNT. BR-CLN-08: SCHEDULED -> COMPLETED, atómico; pelo menos um resultado ou um PDF carregado; sem interpretação (D11); issuedBy=CLINIC; dispara exam.results. Só exame da própria clínica. UC-CLN-10. ADR-023. M15 T (BR-CLN-47..49): sem `results` no corpo usa o rascunho (results-draft); com >=1 resultado estruturado e `generateReport` (omissão true) gera o laudo PDF como Document do exame (generatedBySystem), na mesma transação."
