        skippedTimeOff: { type: integer, minimum: 0, description: "Ignorados por bloqueio/férias (BR-CLN-14)." }
        keptBooked: { type: integer, minimum: 0, description: "Horários que já não correspondem à regra mas têm marcações ativas e foram mantidos." }
