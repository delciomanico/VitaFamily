          format: date-time
          nullable: true
        waitingMinutes:
          type: integer
          minimum: 0
          nullable: true
          description: "Espera: (startedAt ou agora) - arrivedAt, em minutos inteiros; nulo sem arrivedAt."
        followUpDueOn:
          type: string
          format: date
          nullable: true
          description: "M14 Q (BR-CLN-30). Retorno proposto ainda por tratar."
        receiptId:
          type: string
          format: uuid
          nullable: true
          description: "M14 R (BR-CLN-31). Recibo ISSUED da marcação; nulo se não existe. Nunca devolvido ao CLINIC_DOCTOR (BR-CLN-39)."
        reportStatus:
          type: string
          enum: [DRAFT, FINAL]
          nullable: true
          description: "M15 S (BR-CLN-41). Estado do relatório da consulta; nulo se não existe."
        examOrderCount:
          type: integer
          minimum: 0
          description: "M15 U (BR-CLN-51). Pedidos de exame não cancelados da marcação."
    ClinicPatientLookupRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: "E-mail exato (normalizado no servidor); nunca registado em logs/auditoria."
    ClinicPatientLookupResult:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          description: "Primeiro nome + inicial do último apelido (ex. 'Maria S.'). Nenhum id (BR-CLN-03, BR-CLN-10)."
    ClinicWalkInAppointmentRequest:
      type: object
      additionalProperties: false
      required: [slotId]
      oneOf:
        - required: [patientEmail]
        - required: [clinicPatientId]
      description: "BR-CLN-10/18. Exatamente um de patientEmail (utilizador Vita, ADR-024) e clinicPatientId (paciente da clínica, M14 P)."
      properties:
        patientEmail:
          type: string
          format: email
          maxLength: 254
        clinicPatientId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        notes:
          type: string
          maxLength: 2000
          nullable: true
    ClinicConsent:
      type: object
      required: [clinicId, clinicName, level, validUntil, renewalNeeded, linked]
      description: "BR-CLN-19. O que uma clínica parceira pode ver do membro (quem vê o quê)."
      properties:
        clinicId: { type: string, format: uuid }
        clinicName: { type: string }
        level:
          type: string
          enum: [BOOKINGS, HISTORY]
          description: "Nível efetivo. BOOKINGS = Marcações (omissão); HISTORY = Partilhar histórico (medicação e exames). HISTORY expirado aparece como BOOKINGS."
        validUntil: { type: string, format: date-time, nullable: true, description: "Fim da validade do nível HISTORY (12 meses); nulo em BOOKINGS." }
        renewalNeeded: { type: boolean, description: "true se o HISTORY expirou e pode ser renovado." }
        linked: { type: boolean, description: "true se a clínica já tem um paciente ligado a este membro." }
    ClinicConsentInput:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level: { type: string, enum: [BOOKINGS, HISTORY] }
    ClinicLinkCode:
      type: object
      required: [code, expiresAt]
      description: "BR-CLN-20. Código de uso único, 10 min. Apresentar à clínica em texto ou QR (o QR codifica só o código)."
      properties:
        code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{8}$', description: "8 caracteres sem 0/O/1/I/L; mostrado como XXXX-XXXX (o hífen é ignorado ao consumir)." }
        expiresAt: { type: string, format: date-time }
    ClinicPatientVitaLink:
      type: object
      required: [via, consentLevel, consentValidUntil]
      description: "BR-CLN-17/19. Sem ids Vita: só a forma da ligação e o consentimento efetivo."
      properties:
        via: { type: string, enum: [EMAIL, CODE] }
        consentLevel: { type: string, enum: [BOOKINGS, HISTORY], nullable: true }
        consentValidUntil: { type: string, format: date-time, nullable: true }
    ClinicPatient:
      type: object
      required: [id, name, phone, email, birthDate, notes, origin, vitaLink, createdAt, updatedAt]
      description: "BR-CLN-17. Registo próprio da clínica (a clínica é responsável pelo tratamento, ADR-026). Nunca contém ids Vita."
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, maxLength: 30, nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true, description: "Contacto da clínica; nunca é usado para procurar contas Vita." }
        birthDate: { type: string, format: date, nullable: true }
        notes: { type: string, maxLength: 2000, nullable: true, description: "Notas internas da clínica." }
        origin: { type: string, enum: [MANUAL, VITA] }
        vitaLink:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ClinicPatientVitaLink"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClinicPatientInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, maxLength: 30, pattern: '^[+0-9 ()-]{5,30}$', nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        birthDate: { type: string, format: date, nullable: true, description: "Não pode ser futura." }
        notes: { type: string, maxLength: 2000, nullable: true }
    ClinicPatientPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, maxLength: 30, pattern: '^[+0-9 ()-]{5,30}$', nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        notes: { type: string, maxLength: 2000, nullable: true }
    ClinicPatientPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ClinicPatient" }
        nextCursor: { type: string, nullable: true }
    ClinicPatientLinkRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 8, maxLength: 9, description: "O código do paciente (com ou sem hífen, sem distinção de maiúsculas). Nunca registado em logs/auditoria." }
        clinicPatientId: { type: string, format: uuid, description: "Opcional: liga este paciente da clínica em vez de criar um novo." }
    ClinicPatientRecord:
      type: object
      required: [patient, bookings, examinations, recommendations]
      description: "Ficha: só atividade da própria clínica (BR-CLN-03/17)."
      properties:
        patient: { $ref: "#/components/schemas/ClinicPatient" }
        bookings:
          type: array
          items: { $ref: "#/components/schemas/ClinicBooking" }
        examinations:
          type: array
          items: { $ref: "#/components/schemas/ClinicExamBooking" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/ClinicRecommendation" }
    ClinicSharedMedication:
      type: object
      required: [name, dosage, startAt, endAt, continuous]
      properties:
        name: { type: string }
        dosage: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, nullable: true }
        continuous: { type: boolean }
    ClinicSharedExamResult:
      type: object
      required: [parameter]
      properties:
        parameter: { type: string }
        valueNumeric: { type: number, nullable: true }
        valueText: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        referenceMin: { type: number, nullable: true }
        referenceMax: { type: number, nullable: true }
    ClinicSharedExam:
      type: object
      required: [name, examDate, status, results]
      properties:
        name: { type: string }
        examDate: { type: string, format: date }
        status: { type: string, enum: [SCHEDULED, COMPLETED] }
        results:
          type: array
          items: { $ref: "#/components/schemas/ClinicSharedExamResult" }
    ClinicSharedHistory:
      type: object
      required: [active, level, validUntil, medications, examinations]
      description: "BR-CLN-21. Só leitura. active=false (sem consentimento HISTORY válido) => listas vazias. Sem interpretação nem alertas por valor (D11); sem documentos nem notas."
      properties:
        active: { type: boolean }
        level: { type: string, enum: [BOOKINGS, HISTORY], nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        medications:
          type: array
          items: { $ref: "#/components/schemas/ClinicSharedMedication" }
        examinations:
          type: array
          items: { $ref: "#/components/schemas/ClinicSharedExam" }
    ClinicCalendarEntry:
      type: object
      required: [id, source, kind, status, startsAt, endsAt, patientName]
      description: "BR-CLN-23. Marcação do calendário; mínimo necessário (BR-CLN-03)."
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [VITA, MANUAL] }
        kind: { type: string, enum: [APPOINTMENT, EXAM] }
        status: { type: string, enum: [REQUESTED, SCHEDULED, REJECTED, COMPLETED, NO_SHOW, CANCELLED] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: "Fim da duração da marcação (de exame: o do horário)." }
        professionalId: { type: string, format: uuid, nullable: true }
        professionalName: { type: string, nullable: true }
        specialty: { type: string, nullable: true, description: "Serviço/especialidade; em exame, o tipo de exame." }
        patientName: { type: string }
        clinicPatientId: { type: string, format: uuid, nullable: true }
        slotId: { type: string, format: uuid, nullable: true }
        confirmationStatus:
          type: string
          nullable: true
          enum: [PENDING, CONFIRMED, DECLINED]
          description: "M14 Q. Nulo em exames."
        dayState:
          type: string
          nullable: true
          enum: [SCHEDULED, ARRIVED, IN_PROGRESS, COMPLETED, NO_SHOW, CANCELLED, REQUESTED, REJECTED]
          description: "M14 Q (BR-CLN-28). Nulo em exames."
        arrivedAt: { type: string, format: date-time, nullable: true }
        waitingMinutes: { type: integer, minimum: 0, nullable: true }
    ClinicCalendarFreeSlot:
      type: object
      required: [slotId, kind, startsAt, endsAt, specialty, remaining]
      properties:
        slotId: { type: string, format: uuid }
        kind: { type: string, enum: [APPOINTMENT, EXAM] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        professionalId: { type: string, format: uuid, nullable: true }
        professionalName: { type: string, nullable: true }
        specialty: { type: string }
        remaining: { type: integer, minimum: 1 }
    ClinicCalendar:
      type: object
      required: [from, to, entries, freeSlots]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ClinicCalendarEntry" }
        freeSlots:
          type: array
          items: { $ref: "#/components/schemas/ClinicCalendarFreeSlot" }
    ClinicSearchResult:
      type: object
      required: [patients, bookings]
      properties:
        patients:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ClinicPatient" }
        bookings:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ClinicCalendarEntry" }
    ClinicFollowUpRequest:
      type: object
      additionalProperties: false
      required: [amount, unit]
      properties:
        amount: { type: integer, minimum: 1, maximum: 24 }
        unit: { type: string, enum: [WEEKS, MONTHS] }
    ClinicFollowUp:
      type: object
      required: [bookingId, source, patientName, dueOn, patientNotified]
      description: "BR-CLN-30. Retorno por tratar; sem ids Vita."
      properties:
        bookingId: { type: string, format: uuid, description: "Id da consulta/visita de origem (usar nas rotas /agenda)." }
        source: { type: string, enum: [VITA, MANUAL] }
        clinicPatientId: { type: string, format: uuid, nullable: true }
        patientName: { type: string }
        patientPhone: { type: string, nullable: true, description: "Do registo da clínica (ClinicPatient), se existir." }
        dueOn: { type: string, format: date }
        patientNotified: { type: boolean, description: "Derivado: true se a marcação é Vita e hoje (CLINIC_TIMEZONE) >= dueOn - 7 dias, isto é, o alerta de retorno já é devido; sempre false em visitas manuais." }
    ReportCounts:
      type: object
      required: [slotsTotal, slotsBooked, completed, noShows, cancellations, declinedByPatient]
      description: "BR-CLN-29. Só contagens e taxas (0..1), sem PII."
      properties:
        slotsTotal: { type: integer, minimum: 0, description: "Soma das vagas (capacity) dos horários com startsAt na janela." }
        slotsBooked: { type: integer, minimum: 0, description: "Vagas ocupadas por marcações ativas ou realizadas (nunca > slotsTotal)." }
        occupancyRate: { type: number, minimum: 0, maximum: 1, nullable: true, description: "slotsBooked / slotsTotal; nulo se slotsTotal = 0." }
        completed: { type: integer, minimum: 0, description: "Consultas e visitas COMPLETED." }
        noShows: { type: integer, minimum: 0, description: "Consultas e visitas NO_SHOW." }
        noShowRate: { type: number, minimum: 0, maximum: 1, nullable: true, description: "noShows / (completed + noShows); nulo se o denominador é 0." }
        cancellations: { type: integer, minimum: 0, description: "Consultas e visitas CANCELLED (inclui pedidos desistidos e 'Não posso'; não inclui REJECTED)." }
        declinedByPatient: { type: integer, minimum: 0, description: "Subconjunto de cancellations com confirmationStatus=DECLINED ('Não posso')." }
    ClinicReportRow:
      allOf:
        - $ref: "#/components/schemas/ReportCounts"
        - type: object
          required: [professionalName]
          properties:
            professionalId: { type: string, format: uuid, nullable: true, description: "Nulo = 'sem profissional'." }
            professionalName: { type: string, nullable: true }
    ClinicReportSummary:
      type: object
      required: [from, to, totals, byProfessional]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals:
          allOf:
            - $ref: "#/components/schemas/ReportCounts"
            - type: object
              required: [newPatients, examsCompleted]
              properties:
                newPatients: { type: integer, minimum: 0, description: "ClinicPatient criados na janela (sempre da clínica inteira; não se filtra por profissional)." }
                examsCompleted: { type: integer, minimum: 0, description: "Exames COMPLETED com horário na janela." }
        byProfessional:
          type: array
          items: { $ref: "#/components/schemas/ClinicReportRow" }
          description: "Uma linha por profissional com horários ou marcações na janela (mais 'sem profissional'). Com professionalId só essa linha."
    ClinicRequestResponse:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [CONFIRM, REJECT]
        note:
          type: string
          nullable: true
          description: "Motivo, relevante só em REJECT."
    ClinicCancelRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
    ClinicCompleteAppointmentRequest:
      type: object
      properties:
        outcomeNote:
          type: string
          nullable: true
          description: "Resultado da consulta (BR-CLN-06)."
        prescription:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PrescriptionInput"
          description: "Opcional; se presente, cria a receita com issuedBy=CLINIC (BR-RX-07)."
        report:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConsultationReportInput"
          description: "M15 S (BR-CLN-42/44). Opcional; presente = grava e finaliza o relatório na mesma transação (só CLINIC_DOCTOR da marcação; Admin/Gestor ⇒ FORBIDDEN, nada se grava). Ausente = o rascunho fica como está."
        examOrders:
          type: array
          nullable: true
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/ExamOrderItemInput" }
          description: "M15 U (BR-CLN-51). Opcional; cria 1-5 pedidos de exame na mesma transação da conclusão (só CLINIC_DOCTOR da marcação; Admin/Gestor => FORBIDDEN, nada se grava; >5 ativos => LIMIT_EXCEEDED)."
    ClinicDocumentView:
      type: object
      required: [id, originalName, sizeBytes, scanStatus, createdAt]
      description: "BR-CLN-08: só metadados; a clínica nunca descarrega."
      properties:
        generatedBySystem:
          type: boolean
          description: "M15 T (BR-CLN-49). true = laudo gerado pelo sistema (a clínica pode descarregá-lo); false = PDF carregado (só metadados)."
        id:
          type: string
          format: uuid
        originalName:
          type: string
        sizeBytes:
          type: integer
        scanStatus:
          type: string
          enum: [PENDING, CLEAN, INFECTED]
        createdAt:
          type: string
          format: date-time
    ClinicExamBooking:
      type: object
      required: [id, status, scheduledAt, patientName]
      description: "BR-CLN-03: mínimo necessário; nunca dados de saúde da família."
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED]
          description: "ADR-023 revisto: sem REQUESTED/REJECTED (o exame nasce SCHEDULED)."
        slotId:
          type: string
          format: uuid
          nullable: true
        scheduledAt:
          type: string
          format: date-time
        examType:
          type: string
          nullable: true
          description: "Tipo de exame do horário (ClinicSlot.specialty)."
        professionalName:
          type: string
          nullable: true
        patientName:
          type: string
        notes:
          type: string
          nullable: true
        responseNote:
          type: string
          nullable: true
        resultsCount:
          type: integer
          description: "Nº de parâmetros emitidos pela clínica (nunca os valores)."
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ClinicDocumentView"
        resultsIssuedAt:
          type: string
          format: date-time
          nullable: true
        receiptId:
          type: string
          format: uuid
          nullable: true
          description: "M14 R (BR-CLN-31). Recibo ISSUED do exame; nulo se não existe; nunca devolvido ao CLINIC_DOCTOR."
        hasResultsDraft:
          type: boolean
          description: "M15 T (BR-CLN-47). Existe rascunho de resultados (exame SCHEDULED)."
        reportAvailable:
          type: boolean
          description: "M15 T (BR-CLN-49). Existe laudo PDF gerado e descarregável em .../report/pdf."
    ClaimReceiptRef:
      type: object
      required: [receiptId, number, status, totalMinor, currency]
      description: "Referência a um recibo anexado a um pedido (lado do titular, M14 R)."
      properties:
        receiptId: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/ClinicReceiptStatus" }
        totalMinor: { type: integer, format: int64 }
        currency: { type: string }
    InsuranceClaimReceipt:
      type: object
      required: [number, issuedAt, clinicName, lines, totalMinor, currency, status]
      description: "Resumo mínimo visto pela seguradora (BR-CLN-36): sem PDF, sem ids, sem profissional, sem método de pagamento."
      properties:
        number: { type: integer, minimum: 1 }
        issuedAt: { type: string, format: date-time }
        clinicName: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ClinicReceiptLinePublic" }
        totalMinor: { type: integer, format: int64 }
        currency: { type: string }
        status: { $ref: "#/components/schemas/ClinicReceiptStatus" }
    ClinicReceiptStatus:
      type: string
      enum: [ISSUED, VOIDED]
      description: "BR-CLN-33. ISSUED → VOIDED (irreversível)."
    ReceiptPaymentMethod:
      type: string
      enum: [CASH, CARD, TRANSFER, INSURANCE]
      description: "Informativo (BR-CLN-31): nada é cobrado nem integrado."
    ClinicReceiptLinePublic:
      type: object
      required: [description, amountMinor]
      properties:
        description: { type: string, minLength: 1, maxLength: 120 }
        amountMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
    ClinicReceiptLine:
      type: object
      required: [position, description, amountMinor]
      properties:
        position: { type: integer, minimum: 1, maximum: 20 }
        description: { type: string, minLength: 1, maxLength: 120 }
        amountMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
        serviceTypeId: { type: string, format: uuid, nullable: true, description: "Origem no catálogo; nulo em linhas livres." }
    ClinicReceiptIssuer:
      type: object
      required: [name]
      description: "Retrato do perfil da clínica no momento da emissão (BR-CLN-31)."
      properties:
        name: { type: string }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
    ClinicReceipt:
      type: object
      required: [id, number, bookingKind, bookingId, status, paymentMethod, currency, totalMinor, patientName, issuer, lines, issuedAt, notice, availableToPatient]
      description: "Recibo interno não fiscal (M14 R, BR-CLN-31..35). Imutável salvo a anulação. Contém tudo o que é preciso para imprimir; sem ids Vita."
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1, description: "Sequencial por clínica, sem falhas (BR-CLN-32); apresentar como R- + 6 dígitos." }
        bookingKind: { type: string, enum: [APPOINTMENT, EXAM, VISIT] }
        bookingId: { type: string, format: uuid, description: "Id da consulta (agenda), do exame ou da visita da própria clínica." }
        status: { $ref: "#/components/schemas/ClinicReceiptStatus" }
        paymentMethod: { $ref: "#/components/schemas/ReceiptPaymentMethod" }
        currency: { type: string, description: "Moeda da clínica no momento (ISO 4217)." }
        totalMinor: { type: integer, format: int64, minimum: 1, maximum: 100000000000, description: "Soma das linhas, em cêntimos." }
        patientName: { type: string, description: "Retrato do nome na marcação (BR-CLN-03)." }
        note: { type: string, nullable: true, maxLength: 200 }
        issuer: { $ref: "#/components/schemas/ClinicReceiptIssuer" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ClinicReceiptLine" }
          minItems: 1
          maxItems: 20
        issuedAt: { type: string, format: date-time }
        issuedByClinicAccountId: { type: string, format: uuid, nullable: true }
        voidedAt: { type: string, format: date-time, nullable: true }
        voidReason: { type: string, nullable: true, description: "Interno da clínica; nunca vai ao paciente nem à seguradora." }
        voidedByClinicAccountId: { type: string, format: uuid, nullable: true }
        notice: { type: string, description: "Texto fixo obrigatório: 'Documento não fiscal — não substitui fatura'." }
        availableToPatient: { type: boolean, description: "Existe ligação ao paciente Vita (consentimento na emissão, BR-CLN-35)." }
    ClinicReceiptLineInput:
      type: object
      additionalProperties: false
      description: "Linha do catálogo (serviceTypeId; descrição e valor vêm do catálogo, amountMinor opcional ajusta) ou livre (description + amountMinor)."
      properties:
        serviceTypeId: { type: string, format: uuid }
        description: { type: string, minLength: 1, maxLength: 120 }
        amountMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
    ClinicReceiptInput:
      type: object
      additionalProperties: false
      required: [bookingKind, bookingId, paymentMethod]
      properties:
        bookingKind: { type: string, enum: [APPOINTMENT, EXAM, VISIT] }
        bookingId: { type: string, format: uuid }
        paymentMethod: { $ref: "#/components/schemas/ReceiptPaymentMethod" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ClinicReceiptLineInput" }
          minItems: 1
          maxItems: 20
