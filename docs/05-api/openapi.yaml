      description: "Autorização: CLINIC_ACCOUNT (Admin e Gestor qualquer marcação; Médico as suas). M15 V, BR-CLN-55, UC-CLN-43. Só marcação COMPLETED ou SCHEDULED com arrivedAt (senão INVALID_STATE_TRANSITION). Sem especialidade, diagnóstico nem relatório; profissional só com includeProfessional=true. Gerado a pedido, não é guardado; `Content-Disposition: inline; filename=declaracao-AAAAMMDD.pdf`. Rate limit 30/min por conta (bolsa partilhada). Auditoria ATTENDANCE_STATEMENT_ISSUED (sem dados pessoais). Só a clínica emite: não há rota na família."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          description: "Id de uma consulta Vita ou de uma visita manual da clínica (despacho pelo id, BR-CLN-18)."
          schema: { type: string, format: uuid }
        - name: includeProfessional
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: "PDF gerado pelo sistema (Cache-Control: private, no-store)."
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "INVALID_STATE_TRANSITION (sem comparência: faltou, cancelada, pedida, ou agendada sem chegada)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/agenda/{appointmentId}/confirm:
    put:
      tags: [Clinic Portal]
      operationId: confirmClinicAppointmentByPhone
      summary: "Marcar 'confirmado por telefone' (consulta ou visita)."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). M14 Q, BR-CLN-27, UC-CLN-20. SCHEDULED e futura: confirmationStatus=CONFIRMED, confirmationSource=CLINIC. Idempotente. Numa consulta Vita DECLINED (já CANCELLED) -> INVALID_STATE_TRANSITION."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          description: "Id de uma consulta Vita ou de uma visita manual da clínica (mesmo despacho de cancel/complete, BR-CLN-18)."
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicBooking" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (inexistente ou de outra clínica)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "INVALID_STATE_TRANSITION (não SCHEDULED ou já passou)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/agenda/{appointmentId}/arrive:
    put:
      tags: [Clinic Portal]
      operationId: arriveClinicAppointment
      summary: "Check-in: 'Chegou'."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). M14 Q, BR-CLN-28, UC-CLN-21. SCHEDULED (ou NO_SHOW, correção) no dia local da clínica (CLINIC_TIMEZONE): define arrivedAt=agora (idempotente: repetir mantém o primeiro arrivedAt); a partir de NO_SHOW volta a SCHEDULED."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          description: "Id de uma consulta Vita ou de uma visita manual da clínica (mesmo despacho de cancel/complete, BR-CLN-18)."
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicBooking" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (inexistente ou de outra clínica)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "INVALID_STATE_TRANSITION (estado terminal CANCELLED/COMPLETED/REQUESTED/REJECTED, ou fora do dia da marcação)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/agenda/{appointmentId}/start:
    put:
      tags: [Clinic Portal]
      operationId: startClinicAppointment
      summary: "Iniciar o atendimento: 'Iniciar'."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). M14 Q, BR-CLN-28, UC-CLN-21. SCHEDULED no dia local: define startedAt=agora (e arrivedAt=agora se ainda não houve 'Chegou'); idempotente. Não muda o estado Vita da consulta (continua SCHEDULED até concluir)."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          description: "Id de uma consulta Vita ou de uma visita manual da clínica (mesmo despacho de cancel/complete, BR-CLN-18)."
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicBooking" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (inexistente ou de outra clínica)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "INVALID_STATE_TRANSITION (não SCHEDULED ou fora do dia da marcação)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/agenda/{appointmentId}/no-show:
    put:
      tags: [Clinic Portal]
      operationId: noShowClinicAppointment
      summary: "Registar falta: 'Faltou'."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). M14 Q, BR-CLN-28, UC-CLN-21. SCHEDULED e já iniciada a hora (scheduledAt <= agora), sem startedAt: consulta SCHEDULED -> NO_SHOW (visita: SCHEDULED -> NO_SHOW). Idempotente. Não liberta nem reabre o horário."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          description: "Id de uma consulta Vita ou de uma visita manual da clínica (mesmo despacho de cancel/complete, BR-CLN-18)."
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicBooking" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (inexistente ou de outra clínica)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "INVALID_STATE_TRANSITION (não SCHEDULED, ainda não é a hora, ou o atendimento já começou)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/agenda/{appointmentId}/follow-up:
    put:
      tags: [Clinic Portal]
      operationId: setClinicFollowUp
      summary: "Propor retorno ('voltar em N semanas/meses') numa consulta ou visita concluída."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). M14 Q, BR-CLN-30, UC-CLN-23. Só COMPLETED. followUpDueOn = dia local de scheduledAt (CLINIC_TIMEZONE) + N semanas ou N meses. Substitui um retorno anterior ainda não tratado. Numa consulta Vita, o paciente recebe o alerta FOLLOWUP_REMINDER 7 dias antes (texto genérico, BR-ALR-07/08); numa visita manual não há alerta (a clínica contacta, GET /clinic-portal/follow-ups)."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicFollowUpRequest" }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicBooking" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "INVALID_STATE_TRANSITION (não COMPLETED)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (amount fora de 1..24)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [Clinic Portal]
      operationId: clearClinicFollowUp
      summary: "Remover/dar por tratado o retorno."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). M14 Q, BR-CLN-30. Limpa followUpDueOn (a clínica já contactou ou não é necessário). Idempotente. Cancela o alerta ainda não enviado."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicBooking" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/follow-ups:
    get:
      tags: [Clinic Portal]
      operationId: listClinicFollowUps
      summary: "Retornos por tratar (a contactar/acompanhar)."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). M14 Q, BR-CLN-30, UC-CLN-23. Retornos com followUpDueOn <= until (omissão: hoje + 14 dias), ordenados por data; máx. 200. Só da própria clínica; sem ids Vita; contacto do paciente apenas se existir no registo da clínica (ClinicPatient)."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: until
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: "#/components/schemas/ClinicFollowUp" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (until inválido)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/reports/summary:
    get:
      tags: [Clinic Portal]
      operationId: getClinicReportSummary
      summary: "Indicadores simples da clínica (contagens): ocupação, realizadas, faltas, cancelamentos, novos pacientes."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). M14 Q, BR-CLN-29, UC-CLN-24. Janela de dias locais [from, to] (CLINIC_TIMEZONE, inclusivos, to >= from, <= 366 dias). Só contagens e taxas, nunca nomes nem ids de pacientes. professionalId opcional filtra um profissional (de outra clínica: NOT_FOUND). Limite de 30 pedidos/min por conta (RATE_LIMITED). Só leitura; não auditado."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: professionalId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicReportSummary" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (profissional de outra clínica ou inexistente)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (to < from; janela > 366 dias)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED (Retry-After)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/patient-lookup:
    post:
      tags: [Clinic Portal]
      operationId: clinicPatientLookup
      summary: "Pesquisar um utilizador Vita por e-mail exato (só nome de apresentação)."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). BR-CLN-10, ADR-024, UC-CLN-08. Devolve só displayName; 404 idêntico para inexistente/não ACTIVE/sem membro SELF. Rate limit por conta e por IP. Auditoria CLINIC_WALKIN_LOOKUP (sem e-mail)."
      security:
        - clinicBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicPatientLookupRequest" }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicPatientLookupResult" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (genérico)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (e-mail inválido)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED (Retry-After)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/walk-in-appointments:
    post:
      tags: [Clinic Portal]
      operationId: createClinicWalkInAppointment
      summary: "Marcar uma consulta presencial (SCHEDULED) para um paciente Vita (por e-mail exato) ou da clínica, num horário livre da própria clínica."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). BR-CLN-10/18, ADR-024, UC-CLN-08. Exatamente um de patientEmail e clinicPatientId. Com patientEmail o servidor re-resolve o e-mail (sem ids na API), cria/liga o paciente da clínica e a consulta nasce SCHEDULED no membro SELF (walk_in=true). Com clinicPatientId: paciente ligado a um membro Vita => consulta no membro (como acima); paciente manual ou sem ligação => visita presencial só da clínica (source=MANUAL), que não aparece na app Vita. Auditoria CLINIC_WALKIN_BOOK (ou CLINIC_VISIT_BOOK). Alerta APPOINTMENT_CONFIRMED quando existir (OP-22)."
      security:
        - clinicBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicWalkInAppointmentRequest" }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicBooking" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (horário de outra clínica/inexistente, paciente não resolvível ou clinicPatientId de outra clínica; genérico)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "CONFLICT (horário ocupado ou passado; sobreposição com consulta SCHEDULED do paciente)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (e-mail inválido; horário kind=EXAM; nenhum ou ambos de patientEmail/clinicPatientId)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED (Retry-After)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/patients:
    get:
      tags: [Clinic Portal]
      operationId: listClinicPatients
      summary: "Listar/pesquisar os pacientes da própria clínica (paginado)."
      description: "Autorização: CLINIC_ACCOUNT (CLINIC_ADMIN e CLINIC_MANAGER, authorization.md §6.2). UC-CLN-14, BR-CLN-17/22. q (2–100 caracteres) pesquisa por nome (sem distinção de maiúsculas/acentos, contém), e-mail (contém) e telefone (contém, ≥3 dígitos); omitido = todos. Ordem: nome. Nunca pesquisa a base Vita. Limite de 60 pedidos/min por conta (RATE_LIMITED)."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicPatientPage" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (q curto/longo; cursor inválido)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED (Retry-After)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    post:
      tags: [Clinic Portal]
      operationId: createClinicPatient
      summary: "Criar um paciente da clínica (cliente de balcão, sem conta Vita)."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). UC-CLN-14, BR-CLN-17. Nasce com origin=MANUAL e sem ligação Vita. Não há unicidade por nome (homónimos são válidos). Auditoria CLINIC_PATIENT_CREATE (sem dados pessoais)."
      security:
        - clinicBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicPatientInput" }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicPatient" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/patients/link:
    post:
      tags: [Clinic Portal]
      operationId: linkClinicPatient
      summary: "Ligar um paciente Vita à clínica com o código/QR gerado pelo paciente."
      description: "Autorização: CLINIC_ACCOUNT (ambos os papéis). UC-CLN-15, BR-CLN-20. Consome o código (uso único, 10 min). Sem clinicPatientId cria um paciente da clínica (origin=VITA, nome de apresentação); com clinicPatientId liga um paciente existente ainda não ligado. Cria o consentimento BOOKINGS se não existir. 404 idêntico para código inválido, expirado ou já usado. Rate limit partilhado com BR-CLN-10. Auditoria CLINIC_PATIENT_LINK (sem o código)."
      security:
        - clinicBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicPatientLinkRequest" }
      responses:
        '200':
          description: "Ligado (idempotente se o membro já estava ligado a este paciente)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicPatient" }
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (genérico: código inválido, expirado ou usado; clinicPatientId de outra clínica)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "CONFLICT (o paciente indicado já está ligado a outra pessoa, ou o membro já está ligado a outro paciente da clínica)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (formato do código)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED (Retry-After)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /clinic-portal/patients/{patientId}:
    get:
