        serviceTypeId: { type: string, format: uuid }
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
          description: "ISO: 1 = segunda ... 7 = domingo."
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: "Hora local da clínica (HH:mm)." }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: "Hora local; > startTime; o último horário termina em ou antes de endTime." }
        validFrom: { type: string, format: date, nullable: true, description: "Dia local; nulo = desde já." }
        validUntil: { type: string, format: date, nullable: true, description: "Dia local inclusivo; nulo = sem fim." }
        capacity: { type: integer, minimum: 1, maximum: 50, description: "Vagas por horário gerado; > 1 só se o serviço for EXAM (BR-APT-11)." }
        active: { type: boolean }
    ClinicScheduleRuleInput:
      type: object
      additionalProperties: false
      required: [professionalId, serviceTypeId, weekdays, startTime, endTime]
      properties:
        professionalId: { type: string, format: uuid }
        serviceTypeId: { type: string, format: uuid }
        weekdays: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 1, maximum: 7 } }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        validFrom: { type: string, format: date, nullable: true }
        validUntil: { type: string, format: date, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 50, default: 1 }
    ClinicScheduleRulePatch:
      type: object
      additionalProperties: false
      minProperties: 1
