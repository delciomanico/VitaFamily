  /clinic-portal/receipts:
    get:
      tags: [Clinic Portal]
      operationId: listClinicReceipts
      summary: "Financeiro: listar os recibos da clínica num período, com o total do período."
      description: "Autorização: CLINIC_ADMIN e CLINIC_MANAGER (CLINIC_DOCTOR ⇒ FORBIDDEN; authorization.md §6.2b). UC-CLN-27, BR-CLN-37. from/to = dias locais inclusivos em CLINIC_TIMEZONE (to ≥ from, ≤ 366 dias), obrigatórios. Ordem: issuedAt decrescente. summary cobre o período inteiro (anulados não somam). Limite de 60 pedidos/min por conta (RATE_LIMITED). Não auditado."
      security:
        - clinicBearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string, enum: [ISSUED, VOIDED] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicReceiptPage"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '403':
          description: "FORBIDDEN (CLINIC_DOCTOR)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (janela inválida ou > 366 dias; cursor inválido)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '429':
          description: "RATE_LIMITED (Retry-After)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    post:
      tags: [Clinic Portal]
      operationId: createClinicReceipt
      summary: "Emitir um recibo interno não fiscal para uma marcação concluída."
      description: "Autorização: CLINIC_ADMIN e CLINIC_MANAGER. UC-CLN-25, BR-CLN-31..35. A marcação (consulta Vita, exame ou visita manual) tem de estar COMPLETED e ser da própria clínica; no máximo um recibo ISSUED por marcação. lines omitido ⇒ uma linha com o serviço do horário (preço do catálogo). Numeração sequencial por clínica atribuída na mesma transação (BR-CLN-32). Sem Idempotency-Key (fora do MVP): a UNIQUE parcial devolve CONFLICT num duplo envio. Auditoria CLINIC_RECEIPT_ISSUE (sem dados pessoais)."
      security:
        - clinicBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicReceiptInput" }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicReceipt"
        '401':
          description: "UNAUTHENTICATED"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '403':
          description: "FORBIDDEN (CLINIC_DOCTOR)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '404':
          description: "NOT_FOUND (marcação de outra clínica ou inexistente; serviceTypeId de outra clínica)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '409':
          description: "CONFLICT (já existe recibo ISSUED para a marcação) ou INVALID_STATE_TRANSITION (marcação não COMPLETED)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        '422':
          description: "VALIDATION_ERROR (linhas, valores, total 0, serviço sem preço, sem serviço no horário)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
